<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Anúncios — SILVA·LAB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root {
    /* Tema CLARO "Creme" — remete à logo (o creme do focinho). No claro, --cream
       passa a ser a TINTA escura (texto), e --bg/--panel/--ink são os tons claros. */
    --navy: #141E2E; --bg: #ECE5D5; --panel: #FBF8F1; --panel-2: #F1E9DA;
    --ink: #F1E9DA; --line: #D9CFBB; --line-soft: #E5DCCA;
    --cream: #1B2436; --muted: #5E6B7D; --muted-2: #8493A4;
    --amber: #A96C26; --amber-hi: #B87A2E;
    --cyan: #1B82AC; --cyan-hi: #2591BE;
    --green: #2E7D4F; --green-hi: #2E7D4F;
    --red: #B0413E; --red-hi: #B0413E;
    --num: "Sora", sans-serif; --body: "Inter", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--body); background: var(--bg); color: var(--cream);
    line-height: 1.45; padding: 0 clamp(14px, 3vw, 42px) 40px;
    font-size: 14px; max-width: 1560px; margin: 0 auto;
  }
  a { color: var(--cyan-hi); }
  b, strong { font-weight: 600; }

  /* ───── Cabeçalho ───── */
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
    padding: 18px 0 14px; border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--num); font-weight: 800; font-size: 19px; letter-spacing: .04em; white-space: nowrap; }
  .brand .dot { color: var(--amber); }
  .brand .app { font-family: var(--body); font-weight: 500; font-size: 12.5px; color: var(--muted); letter-spacing: 0; margin-left: 10px; }
  .fresh { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .fresh i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .fresh.ok i { background: var(--green-hi); } .fresh.warn i { background: var(--amber-hi); } .fresh.bad i { background: var(--red-hi); }

  /* ───── Controles: período + abas ───── */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 16px 0 4px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .seg button {
    background: transparent; border: 0; color: var(--muted); font: 500 12.5px var(--body);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: .13s; white-space: nowrap;
  }
  .seg button:hover { color: var(--cream); }
  .seg button.on { background: var(--panel-2); color: var(--cream); font-weight: 600; }
  select, input[type=search], input[type=date] {
    background: var(--panel); color: var(--cream); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; font: 500 13px var(--body);
  }
  select:focus, input:focus { outline: none; border-color: var(--amber); }
  .custom-note { display: none; color: var(--muted-2); font-size: 11.5px; flex-basis: 100%; }
  body.custom-on .custom-note { display: block; }

  /* ── seletor de período estilo Gerenciador (botão + calendário compacto) ── */
  .cal-wrap { position: relative; }
  .cal-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); color: var(--cream); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 13px; font: 600 13px var(--body); cursor: pointer;
  }
  .cal-btn:hover { border-color: var(--amber); }
  .cal-btn i { font-style: normal; color: var(--muted); font-size: 10px; }
  .cal-pop {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
    display: flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 12px 34px rgba(20, 30, 46, .16); overflow: hidden;
  }
  .cal-pop[hidden] { display: none; }
  .cal-presets { display: flex; flex-direction: column; min-width: 126px; border-right: 1px solid var(--line-soft); padding: 6px; }
  .cal-presets button {
    text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px;
    color: var(--muted); font: 500 12.5px var(--body); cursor: pointer; white-space: nowrap;
  }
  .cal-presets button:hover { background: var(--panel-2); color: var(--cream); }
  .cal-presets button.on { background: var(--panel-2); color: var(--cream); font-weight: 600; }
  .cal-right { padding: 10px 12px 11px; width: 254px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head b { font: 600 12.5px var(--num); text-transform: capitalize; }
  .cal-nav { background: none; border: 1px solid var(--line); border-radius: 7px; width: 24px; height: 24px; color: var(--muted); cursor: pointer; line-height: 1; }
  .cal-nav:hover { color: var(--cream); border-color: var(--amber); }
  .cal-nav:disabled { opacity: .3; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .wd { color: var(--muted-2); text-align: center; font-size: 9.5px; padding: 2px 0; text-transform: uppercase; }
  .cal-day {
    border: 0; background: none; padding: 5px 0; text-align: center; border-radius: 7px;
    color: var(--cream); font: 500 11.5px var(--body); cursor: pointer;
  }
  .cal-day:hover { background: var(--panel-2); }
  .cal-day.fora { visibility: hidden; }
  .cal-day.dis { color: var(--line); cursor: default; }
  .cal-day.dis:hover { background: none; }
  .cal-day.in { background: var(--ink); border-radius: 0; }
  .cal-day.edge { background: var(--navy); color: #ECE5D5; font-weight: 700; border-radius: 7px; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--muted); }
  .cal-foot .acts { display: flex; gap: 6px; }
  .cal-cancel { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); font: 500 12px var(--body); cursor: pointer; }
  .cal-apply { background: var(--navy); color: #ECE5D5; border: 0; border-radius: 8px; padding: 6px 13px; font: 600 12px var(--body); cursor: pointer; }
  .cal-apply:disabled { opacity: .4; cursor: default; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 12px; border-bottom: 1px solid var(--line); }
  .tabs button {
    background: transparent; color: var(--muted); border: 1px solid transparent; border-bottom: none;
    border-radius: 10px 10px 0 0; padding: 9px 15px; font: 600 13px var(--body); cursor: pointer;
    transition: .13s; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--cream); }
  .tabs button.active { color: var(--cream); background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); }
  .tabs button.agencia.active, .tabs button.agencia:hover { color: var(--amber-hi); }

  h2.section { font: 700 11.5px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2.section .cnt { color: var(--muted-2); font-weight: 500; letter-spacing: 0; text-transform: none; }

  /* marcador de fonte do dado */
  .src { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: 1px; }
  .src.m { background: var(--amber); } .src.n { background: var(--cyan); }

  /* ───── Herói da folga ───── */
  .hero {
    display: flex; align-items: stretch; gap: 22px; background: var(--panel);
    border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 14px; padding: 20px 22px; margin: 18px 0 6px;
  }
  .hero.good { border-left-color: var(--green-hi); }
  .hero.warn { border-left-color: var(--amber-hi); }
  .hero.bad  { border-left-color: var(--red-hi); }
  .hero.mut  { border-left-color: var(--line); }
  .hero-main { flex: 1; min-width: 0; }
  .hero-kicker { font: 700 10.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .hero.bad .hero-kicker { color: var(--red-hi); }
  .hero-num { font: 700 30px/1.1 var(--num); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .hero-num small { font: 500 13px var(--body); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .hero-sub { color: var(--muted); font-size: 13px; margin-top: 10px; max-width: 720px; }
  .hero-sub b { color: var(--cream); }
  .hero-badge {
    align-self: center; text-align: center; min-width: 110px; padding: 14px 18px;
    border-radius: 12px; background: var(--ink); border: 1px solid var(--line);
  }
  .hero-badge b { display: block; font: 800 26px var(--num); letter-spacing: -.5px; }
  .hero-badge span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .hero.good .hero-badge b { color: var(--green-hi); }
  .hero.warn .hero-badge b { color: var(--amber-hi); }
  .hero.bad  .hero-badge b { color: var(--red-hi); }

  .gauge { position: relative; height: 12px; background: var(--ink); border: 1px solid var(--line-soft); border-radius: 999px; margin: 16px 0 22px; max-width: 720px; }
  .gauge .fill { position: absolute; inset: 2px auto 2px 2px; border-radius: 999px; min-width: 6px; }
  .hero.good .gauge .fill { background: linear-gradient(90deg, var(--green), var(--green-hi)); }
  .hero.warn .gauge .fill { background: linear-gradient(90deg, #8a6a2f, var(--amber-hi)); }
  .hero.bad  .gauge .fill { background: linear-gradient(90deg, var(--red), var(--red-hi)); }
  .gauge .tick { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--cream); opacity: .85; }
  .gauge .tick label { position: absolute; top: 100%; margin-top: 6px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ───── KPIs ───── */
  .kpi-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(164px, 1fr)); margin: 12px 0; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; min-width: 0; }
  .kpi .v { font: 700 20px var(--num); letter-spacing: -.4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .v .u { font: 500 12px var(--body); color: var(--muted); }
  .kpi .k { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .kpi .s { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* ───── Insight ───── */
  .insight {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--amber);
    border-radius: 12px; padding: 14px 18px; margin: 14px 0; font-size: 14px; max-width: 980px;
  }
  .insight .kicker { font: 700 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--amber-hi); display: block; margin-bottom: 5px; }
  .insight b { color: var(--cream); font-weight: 600; }
  .insight.bad { border-left-color: var(--red-hi); }
  .insight.bad .kicker { color: var(--red-hi); }

  /* ───── Funil ───── */
  .funnel { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; min-width: 128px; }
  .stage .sv { font: 700 22px var(--num); font-variant-numeric: tabular-nums; }
  .stage .sk { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .pass { align-self: center; text-align: center; color: var(--muted-2); font-size: 12px; min-width: 54px; }
  .pass b { display: block; color: var(--muted); font: 600 13px var(--num); }

  /* caminho POR VENDA */
  .path-lead { font-size: 13.5px; color: var(--cream); margin: 16px 0 9px; max-width: 940px; }
  .path-lead b { font-weight: 600; }
  .path { display: flex; align-items: stretch; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
  .path-step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 17px; min-width: 98px; text-align: center; }
  .path-step b { display: block; font: 700 19px var(--num); letter-spacing: -.3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .path-step span { font-size: 11px; color: var(--muted); }
  .path-step.money { border-color: var(--amber); } .path-step.money b { color: var(--amber-hi); }
  .path-step.sale { border-color: var(--green); } .path-step.sale b { color: var(--green-hi); }
  .path-arrow { align-self: center; color: var(--muted-2); font-size: 15px; }

  /* ───── Pills / badges ───── */
  .pill { font-size: 10.5px; color: var(--muted); display: block; font-weight: 400; }
  .tag { display: inline-block; font: 600 10.5px var(--body); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); vertical-align: 2px; }
  .tag.esp { border-color: var(--amber); color: var(--amber-hi); }
  .st { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .st.on { background: rgba(46,125,79,.14); color: var(--green-hi); }
  .st.off { background: rgba(94,107,125,.13); color: var(--muted); }
  .st.issue { background: rgba(176,65,62,.13); color: var(--red-hi); }
  .badge { display: inline-block; font: 700 12px var(--num); padding: 3px 10px; border-radius: 999px; }
  .badge.good { background: rgba(46,125,79,.15); color: var(--green-hi); }
  .badge.warn { background: rgba(169,108,38,.16); color: var(--amber-hi); }
  .badge.bad  { background: rgba(176,65,62,.15); color: var(--red-hi); }

  /* ───── Tabelas ───── */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--panel-2); text-align: right; padding: 10px 12px; color: var(--muted);
    font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel-2); z-index: 2; }
  thead th:hover { color: var(--cream); }
  thead th .arrow { color: var(--amber-hi); font-size: 10px; }
  tbody td { padding: 9px 12px; text-align: right; border-top: 1px solid var(--line-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody td:first-child { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--panel); z-index: 1; }
  tbody tr:hover td { background: var(--panel-2); }
  tbody tr.total td { border-top: 2px solid var(--line); background: var(--ink); font-weight: 600; }
  tbody tr.total td:first-child { background: var(--ink); }
  tbody tr.clickable td:first-child { cursor: pointer; color: var(--cyan-hi); }
  .num-good { color: var(--green-hi); } .num-bad { color: var(--red-hi); }
  .empty { color: var(--muted); padding: 18px; }

  .client-head { display: flex; align-items: baseline; gap: 12px; margin: 20px 0 0; flex-wrap: wrap; }
  .client-head h2 { font: 700 20px var(--num); letter-spacing: -.3px; }
  .client-head .acc { color: var(--muted-2); font-size: 12px; }

  /* campanhas: controles */
  .camp-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 10px; }
  .camp-controls input[type=search] { min-width: 240px; flex: 0 1 300px; }

  /* campanhas: cards mobile */
  .camp-cards { display: none; }
  .camp-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; }
  .camp-card .cc-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 9px; }
  .camp-card .cc-name { font-weight: 600; font-size: 13.5px; }
  .camp-card .cc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; }
  .camp-card .cc-grid div { min-width: 0; }
  .camp-card .cc-grid b { display: block; font: 600 14px var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .camp-card .cc-grid span { font-size: 10.5px; color: var(--muted); }

  footer { color: var(--muted-2); font-size: 12px; margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; line-height: 1.7; }
  footer .leg { display: inline-flex; gap: 16px; margin-right: 16px; color: var(--muted); }

  /* ───── Mobile ───── */
  @media (max-width: 760px) {
    body { font-size: 13.5px; }
    .cal-pop { flex-direction: column; width: min(302px, calc(100vw - 28px)); }
    .cal-presets { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line-soft); min-width: 0; }
    .cal-right { width: auto; }
    .hero { flex-direction: column; gap: 14px; padding: 16px; }
    .hero-badge { align-self: stretch; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
    .hero-num { font-size: 24px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .funnel { flex-direction: column; }
    .pass { text-align: left; padding-left: 18px; min-width: 0; }
    .pass b { display: inline; margin-left: 6px; }
    /* tabela Agência vira cards */
    .resp table, .resp thead, .resp tbody, .resp tr, .resp td { display: block; }
    .resp thead { display: none; }
    .resp tr { border-top: 1px solid var(--line); padding: 8px 0; }
    .resp tr:first-child { border-top: none; }
    .resp td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border: none; padding: 4px 14px; white-space: normal; text-align: right; }
    .resp td:first-child { position: static; font-size: 14.5px; padding-top: 6px; }
    .resp td::before { content: attr(data-label); color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; }
    .resp td:first-child::before { content: none; }
    /* campanhas: some a tabela, entram os cards */
    .camp-table { display: none; }
    .camp-cards { display: block; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">SILVA<span class="dot">·</span>LAB<span class="app">Painel de Anúncios</span></div>
    <span class="fresh" id="fresh"><i></i><span></span></span>
  </header>

  <div class="controls">
    <div class="cal-wrap">
      <button class="cal-btn" id="calBtn" type="button"><span id="calLbl"></span><i>▾</i></button>
      <div class="cal-pop" id="calPop" hidden>
        <div class="cal-presets" id="calPresets"></div>
        <div class="cal-right">
          <div class="cal-head">
            <button class="cal-nav" id="calPrev" type="button">‹</button>
            <b id="calMes"></b>
            <button class="cal-nav" id="calNext" type="button">›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-foot">
            <span id="calRange"></span>
            <span class="acts">
              <button class="cal-cancel" id="calCancel" type="button">Cancelar</button>
              <button class="cal-apply" id="calApply" type="button">Aplicar</button>
            </span>
          </div>
        </div>
      </div>
    </div>
    <span class="custom-note">Janela personalizada: alcance e frequência ficam indisponíveis (não somam por dia); conversas = Meta.</span>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>

  <footer id="foot"></footer>

<script src="data.js"></script>
<script src="painel.js"></script>
<script src="diario.js"></script>
<script>
(function () {
  "use strict";
  const D = window.DASHBOARD_DATA || null;
  const P = window.PAINEL_DATA || null;
  const DD = window.DIARIO_DATA || null;           // métricas POR DIA (janela livre)
  const DIDX = {};                                  // campo -> posição no vetor diário
  ((DD && DD.campos) || []).forEach((c, i) => { DIDX[c] = i; });
  const DDBY = {};                                  // client -> conta diária
  ((DD && DD.accounts) || []).forEach(a => { DDBY[a.client] = a; });

  const PERIOD_LABELS = {
    today: "Hoje", yesterday: "Ontem", last_7d: "7 dias", last_14d: "14 dias",
    last_30d: "30 dias", this_month: "Este mês", last_month: "Mês passado", maximum: "Tudo",
    custom: "Personalizado",
  };
  const OBJETIVOS = {
    OUTCOME_SALES: "Vendas", OUTCOME_TRAFFIC: "Tráfego", OUTCOME_LEADS: "Leads",
    OUTCOME_ENGAGEMENT: "Engajamento", OUTCOME_AWARENESS: "Reconhecimento",
    OUTCOME_APP_PROMOTION: "Promoção de app", MESSAGES: "Mensagens", LINK_CLICKS: "Tráfego",
    CONVERSIONS: "Conversões", POST_ENGAGEMENT: "Engajamento", LEAD_GENERATION: "Cadastros",
    REACH: "Alcance", VIDEO_VIEWS: "Vídeo",
  };
  const PLURAL = { "Reunião": "Reuniões", "Avaliação": "Avaliações", "Análise": "Análises" };

  // Colunas da tabela de campanhas (nível Gerenciador — mostrar tudo)
  const COLS = [
    { key: "name",          label: "Campanha",        type: "text" },
    { key: "status",        label: "Status",          type: "status" },
    { key: "objective",     label: "Objetivo",        type: "obj" },
    { key: "budget",        label: "Orçamento",       type: "budget" },
    { key: "spend",         label: "Valor usado",     type: "money" },
    { key: "created",       label: "Criação",         type: "date" },
    { key: "frequency",     label: "Freq.",           type: "dec" },
    { key: "impressions",   label: "Impressões",      type: "int" },
    { key: "reach",         label: "Alcance",         type: "int" },
    { key: "profile_visits",label: "Visitas perfil",  type: "int" },
    { key: "link_clicks",   label: "Cliques no link", type: "int" },
    { key: "conversas",     label: "Conversas",       type: "int" },
    { key: "followers",     label: "Seguidores",      type: "int" },
    { key: "cpm",           label: "CPM",             type: "money" },
    { key: "ctr",           label: "CTR",             type: "pct" },
    { key: "cost_conversa", label: "Custo/conversa",  type: "money" },
    { key: "results",       label: "Resultados",      type: "results" },
    { key: "leads",         label: "Leads",           type: "int" },
    { key: "compras",       label: "Compras",         type: "int" },
    { key: "conversion_value", label: "Valor conv.",  type: "money" },
    { key: "roas",          label: "ROAS",            type: "x" },
    { key: "cost_purchase", label: "Custo/compra",    type: "money" },
    { key: "profit",        label: "Lucro Vendas",    type: "money" },
    { key: "page_views",    label: "Visitas página",  type: "int" },
  ];

  /* ── formatação pt-BR ── */
  const fMoney = (v, cur) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { style: "currency", currency: cur || "BRL" }).format(v);
  const fInt = (v) => v == null ? "—" : new Intl.NumberFormat("pt-BR").format(v);
  const fPct = (v, d) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: d == null ? 1 : d }).format(v) + "%";
  const fX = (v) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(v) + "×";
  const fDec = (v) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(v);
  const fDate = (s) => { if (!s) return "—"; const [y, m, d] = s.split("-"); return (d && m) ? `${d}/${m}/${y.slice(2)}` : s; };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ── estado ── */
  const ACCTS = D && Array.isArray(D.accounts) ? D.accounts.filter(a => a.ok !== false) : [];
  const PBY = {}; ((P && P.accounts) || []).forEach(a => { PBY[a.client] = a; });
  const PERIODS = ((P && P.periods) || (D && D.periods) || []).slice();
  if (DD && !PERIODS.includes("custom")) PERIODS.push("custom");  // janela livre
  const hojeISO = new Date().toISOString().slice(0, 10);
  const DESDE = (DD && DD.desde) || "2026-01-01";
  const state = { period: "this_month", tab: "__agencia__", campFilter: "gasto", campQuery: "", sortCol: "spend", sortDir: -1,
                  cIni: hojeISO.slice(0, 8) + "01", cFim: hojeISO };

  if (!PERIODS.includes(state.period)) state.period = PERIODS[0] || "this_month";

  // restaura do hash (#aba|periodo  ou  #aba|c:2026-02-01:2026-03-15)
  try {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) {
      const [t, p] = h.split("|");
      if (t && (t === "__agencia__" || ACCTS.some(a => a.client === t))) state.tab = t;
      if (p && p.startsWith("c:") && DD) {
        const [, i, f] = p.split(":");
        if (i && f) { state.period = "custom"; state.cIni = i; state.cFim = f; }
      } else if (p && PERIODS.includes(p)) state.period = p;
    }
  } catch (e) { /* hash inválido — ignora */ }

  const fmtBR = (iso) => { const [y, m, d] = (iso || "").split("-"); return d ? `${d}/${m}/${y.slice(2)}` : iso; };
  const periodoLabel = () => state.period === "custom"
    ? `${fmtBR(state.cIni)} → ${fmtBR(state.cFim)}`
    : (PERIOD_LABELS[state.period] || state.period);

  /* ══ JANELA LIVRE: soma os dias no navegador (fonte: diario.js) ══ */
  const emJanela = (d) => d >= state.cIni && d <= state.cFim;

  function somaDias(dias) {                       // {data: vetor} -> {campo: soma}
    const s = {}; ((DD && DD.campos) || []).forEach(c => { s[c] = 0; });
    for (const d in (dias || {})) if (emJanela(d)) {
      const v = dias[d];
      for (const c in DIDX) s[c] += v[DIDX[c]] || 0;
    }
    s.spend = Math.round(s.spend * 100) / 100;
    s.conversion_value = Math.round(s.conversion_value * 100) / 100;
    return s;
  }

  function vendasJanela(client) {                 // vendas_dia do painel.js -> {consultas, vendas, faturamento}
    const dias = (PBY[client] || {}).vendas_dia || {};
    let c = 0, v = 0, f = 0;
    for (const d in dias) if (emJanela(d)) { c += dias[d].c || 0; v += dias[d].v || 0; f += dias[d].f || 0; }
    return { consultas: c, vendas: v, faturamento: Math.round(f * 100) / 100 };
  }

  // porta fiel do resolve_result do coletor (ads_collect.py) — decide a headline da campanha
  function resolveResult(og, dest, objective, m) {
    og = (og || "").toUpperCase(); dest = (dest || "").toUpperCase(); const obj = (objective || "").toUpperCase();
    const msg = ["WHATSAPP", "MESSENGER", "DIRECT"].some(x => dest.includes(x));
    const trafego = m.page_views > 0 ? ["Visitas à página", m.page_views] : ["Cliques no link", m.link_clicks];
    if (["REACH", "AD_RECALL_LIFT", "IMPRESSIONS"].includes(og)) return ["Alcance", null]; // alcance não soma por dia
    if (msg) {
      if (["OFFSITE_CONVERSIONS", "ONSITE_CONVERSIONS", "VALUE"].includes(og) && m.compras > 0) return ["Compras", m.compras];
      return ["Conversas", m.conversas];
    }
    if (og === "LANDING_PAGE_VIEWS") return ["Visitas à página", m.page_views];
    if (["LINK_CLICKS", "PROFILE_VISIT", "PROFILE_AND_PAGE_ENGAGEMENT", "POST_ENGAGEMENT", "PAGE_LIKES",
         "THRUPLAY", "TWO_SECOND_CONTINUOUS_VIDEO_VIEWS", "VIDEO_VIEWS", "EVENT_RESPONSES"].includes(og)) return ["Cliques no link", m.link_clicks];
    if (["LEAD_GENERATION", "QUALITY_LEAD", "SUBSCRIBERS"].includes(og)) return m.leads > 0 ? ["Leads", m.leads] : trafego;
    if (["OFFSITE_CONVERSIONS", "ONSITE_CONVERSIONS", "VALUE"].includes(og)) {
      if (m.compras > 0) return ["Compras", m.compras];
      if (m.leads > 0) return ["Leads", m.leads];
      return trafego;
    }
    if (og === "CONVERSATIONS" || obj.includes("TRAFFIC")) return trafego;
    if (m.compras > 0) return ["Compras", m.compras];
    if (m.conversas > 0) return ["Conversas", m.conversas];
    if (m.leads > 0) return ["Leads", m.leads];
    return (m.page_views > 0 || m.link_clicks > 0) ? trafego : ["—", 0];
  }

  function breakdownJS(camps) {                   // mix da conta (porta do account_breakdown)
    const grp = {}, ordem = ["Compras", "Conversas", "Leads", "Leads (site)", "Visitas à página", "Cliques no link"];
    camps.forEach(c => {
      const l = c.result_type;
      if (!l || l === "—" || l === "Alcance" || !(c.results > 0)) return;
      const g = grp[l] || (grp[l] = { label: l, value: 0, spend: 0 });
      g.value += c.results; g.spend += c.spend || 0;
    });
    return ordem.filter(l => grp[l]).map(l => ({
      label: l, value: grp[l].value,
      cost: grp[l].value ? Math.round(grp[l].spend / grp[l].value * 100) / 100 : null,
    }));
  }

  function campSintetica(cid, cdata, cat) {       // campanha na janela livre (colunas do Gerenciador)
    const s = somaDias(cdata.dias);
    if (!Object.values(s).some(v => v)) return null;
    const meta = cat[cid] || {};
    const [label, val] = resolveResult(meta.opt_goal, meta.dest, meta.objective, s);
    const div = (a, b) => b > 0 ? Math.round(a / b * 100) / 100 : null;
    return {
      id: cid, name: meta.name || "(campanha)", status: meta.status || "—",
      objective: meta.objective || "—", budget: meta.budget == null ? null : meta.budget,
      budget_type: meta.budget_type || "—", created: meta.created || "",
      spend: s.spend, impressions: s.impressions, clicks: s.clicks, link_clicks: s.link_clicks,
      reach: null, frequency: null,               // não somáveis por dia — honestidade
      ctr: div(s.clicks * 100, s.impressions), cpc: div(s.spend, s.clicks), cpm: div(s.spend * 1000, s.impressions),
      conversas: s.conversas, cost_conversa: div(s.spend, s.conversas),
      leads: s.leads, compras: s.compras, conversion_value: s.conversion_value,
      cost_purchase: div(s.spend, s.compras), roas: div(s.conversion_value, s.spend),
      profit: s.conversion_value ? Math.round((s.conversion_value - s.spend) * 100) / 100 : null,
      page_views: s.page_views, profile_visits: s.profile_visits, followers: s.followers,
      result_type: label, results: val == null ? null : Math.round(val), cpl: val > 0 ? div(s.spend, val) : null,
    };
  }

  const _cacheJanela = {};                        // client -> {am, pm, camps} (limpo a cada render)
  function janelaDe(client) {
    if (_cacheJanela[client]) return _cacheJanela[client];
    const dd = DDBY[client];
    const div = (a, b) => b > 0 ? Math.round(a / b * 100) / 100 : null;
    const pct = (a, b) => b > 0 ? Math.round(a / b * 1000) / 10 : null;
    const vazio = { am: {}, pm: {}, camps: [] };
    if (!dd) return (_cacheJanela[client] = vazio);
    const s = somaDias(dd.dias);
    const camps = Object.entries(dd.campanhas || {})
      .map(([cid, c]) => campSintetica(cid, c, dd.catalogo || {}))
      .filter(Boolean).sort((a, b) => b.spend - a.spend);
    const bd = breakdownJS(camps);
    const am = {
      spend: s.spend, impressions: s.impressions, clicks: s.clicks, link_clicks: s.link_clicks,
      reach: null, frequency: null,
      ctr: div(s.clicks * 100, s.impressions), cpc: div(s.spend, s.clicks), cpm: div(s.spend * 1000, s.impressions),
      conversas: s.conversas, results_breakdown: bd,
      result_type: bd.length ? bd[0].label : "—", results: bd.length ? bd[0].value : 0,
      cpl: bd.length ? bd[0].cost : null,
      roas: div(s.conversion_value, s.spend), profit: s.conversion_value ? Math.round((s.conversion_value - s.spend) * 100) / 100 : null,
    };
    // métricas de negócio — mesmas fórmulas do build_painel.metricas()
    const v = vendasJanela(client);
    const teto = div(v.faturamento, s.conversas), custoConv = div(s.spend, s.conversas);
    const pm = {
      gasto: s.spend, conversas: s.conversas, leads: s.leads, cliques: s.link_clicks,
      vendas: v.vendas, faturamento: v.faturamento, consultas: v.consultas,
      ticket: div(v.faturamento, v.vendas), custo_venda: div(s.spend, v.vendas),
      lucro: v.faturamento ? Math.round((v.faturamento - s.spend) * 100) / 100 : null,
      margem_pct: v.faturamento ? pct(v.faturamento - s.spend, v.faturamento) : null,
      roas_conta: div(v.faturamento, s.spend),
      consultas_por_venda: div(v.consultas, v.vendas), taxa_conversao_pct: pct(v.vendas, v.consultas),
      teto_conversa: teto, custo_conversa: custoConv,
      folga: (teto && custoConv) ? Math.round(teto / custoConv * 100) / 100 : null,
    };
    return (_cacheJanela[client] = { am, pm, camps });
  }

  const am = (a) => state.period === "custom" ? janelaDe(a.client).am
    : ((((a.periods || {})[state.period] || {}).account) || {});
  const pmOf = (client) => state.period === "custom" ? janelaDe(client).pm
    : (((((PBY[client] || {}).periods) || {})[state.period]) || {});
  const campsOf = (a) => state.period === "custom" ? janelaDe(a.client).camps
    : ((((a.periods || {})[state.period] || {}).campaigns) || []);

  /* ── nível da folga ── */
  const tone = (folga) => folga == null ? null : folga >= 1.5 ? "good" : folga >= 1 ? "warn" : "bad";
  const folgaBadge = (m) => {
    const t = tone(m.folga);
    return t ? `<span class="badge ${t}" title="teto ${fMoney(m.teto_conversa)} ÷ custo ${fMoney(m.custo_conversa)} por conversa">${fX(m.folga)}</span>` : "—";
  };

  /* ── init ── */
  function init() {
    if (!D || !ACCTS.length) {
      document.getElementById("view").innerHTML = '<div class="empty">Sem dados. Rode a coleta com o token.</div>';
      return;
    }
    // frescor (mídia)
    const el = document.getElementById("fresh");
    const dt = D.generated_at ? new Date(D.generated_at) : null;
    if (dt) {
      const h = (Date.now() - dt.getTime()) / 36e5;
      el.classList.add(h < 26 ? "ok" : h < 50 ? "warn" : "bad");
      el.lastElementChild.textContent = "atualizado " + (h < 1 ? "há menos de 1h" : h < 48 ? "há " + Math.round(h) + "h" : "em " + dt.toLocaleDateString("pt-BR"));
      el.title = dt.toLocaleString("pt-BR");
    } else el.style.display = "none";

    // ── seletor de período estilo Gerenciador: presets à esquerda + calendário ──
    const pop = document.getElementById("calPop"), btn = document.getElementById("calBtn");
    const pres = document.getElementById("calPresets");
    PERIODS.filter(p => p !== "custom").forEach(p => {
      const b = document.createElement("button");
      b.textContent = PERIOD_LABELS[p] || p; b.dataset.p = p;
      b.onclick = () => { state.period = p; fechaCal(); render(); };
      pres.appendChild(b);
    });
    const cal = { ini: null, fim: null, y: 0, m: 0 };   // estado do popover (pendente até Aplicar)
    const mesLbl = document.getElementById("calMes"), grid = document.getElementById("calGrid");
    const rngLbl = document.getElementById("calRange"), btnApply = document.getElementById("calApply");
    const ymMin = DESDE.slice(0, 7), ymMax = hojeISO.slice(0, 7);
    const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
                   "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

    function abreCal() {
      cal.ini = state.period === "custom" ? state.cIni : null;
      cal.fim = state.period === "custom" ? state.cFim : null;
      const ref = cal.fim || hojeISO;
      cal.y = +ref.slice(0, 4); cal.m = +ref.slice(5, 7) - 1;
      pop.hidden = false; desenhaCal();
    }
    function fechaCal() { pop.hidden = true; }
    btn.onclick = () => { pop.hidden ? abreCal() : fechaCal(); };
    document.addEventListener("click", (e) => {
      if (pop.hidden) return;
      // clique num dia re-desenha o grid: quando o evento chega aqui o alvo já foi
      // trocado (desconectado) e o closest() falharia -> NÃO é clique fora, ignora.
      if (!(e.target instanceof Element) || !e.target.isConnected) return;
      if (!e.target.closest(".cal-wrap")) fechaCal();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") fechaCal(); });
    document.getElementById("calCancel").onclick = fechaCal;
    document.getElementById("calPrev").onclick = () => { if (--cal.m < 0) { cal.m = 11; cal.y--; } desenhaCal(); };
    document.getElementById("calNext").onclick = () => { if (++cal.m > 11) { cal.m = 0; cal.y++; } desenhaCal(); };
    btnApply.onclick = () => {
      if (!cal.ini) return;
      state.period = "custom"; state.cIni = cal.ini; state.cFim = cal.fim || cal.ini;
      fechaCal(); render();
    };

    function desenhaCal() {
      const ym = `${cal.y}-${String(cal.m + 1).padStart(2, "0")}`;
      mesLbl.textContent = `${MESES[cal.m]} ${cal.y}`;
      document.getElementById("calPrev").disabled = ym <= ymMin;
      document.getElementById("calNext").disabled = ym >= ymMax;
      let html = ["S", "T", "Q", "Q", "S", "S", "D"].map(d => `<span class="wd">${d}</span>`).join("");
      const off = (new Date(cal.y, cal.m, 1).getDay() + 6) % 7;   // semana começa na segunda
      const nd = new Date(cal.y, cal.m + 1, 0).getDate();
      for (let i = 0; i < off; i++) html += `<button class="cal-day fora" tabindex="-1"></button>`;
      for (let d = 1; d <= nd; d++) {
        const iso = `${ym}-${String(d).padStart(2, "0")}`;
        const dis = iso < DESDE || iso > hojeISO;
        const edge = iso === cal.ini || iso === cal.fim;
        const dentro = cal.ini && cal.fim && iso > cal.ini && iso < cal.fim;
        html += `<button class="cal-day${dis ? " dis" : ""}${dentro ? " in" : ""}${edge ? " edge" : ""}"${dis ? " disabled" : ` data-d="${iso}"`}>${d}</button>`;
      }
      grid.innerHTML = html;
      rngLbl.textContent = cal.ini ? (fmtBR(cal.ini) + " → " + (cal.fim ? fmtBR(cal.fim) : "…")) : "escolha o início";
      btnApply.disabled = !cal.ini;
    }
    // delegação: o grid persiste entre re-desenhos (os botões de dia, não)
    grid.onclick = (e) => {
      const b = e.target.closest(".cal-day[data-d]");
      if (b) diaClick(b.dataset.d);
    };
    function diaClick(iso) {
      if (!cal.ini || (cal.ini && cal.fim)) { cal.ini = iso; cal.fim = null; }
      else if (iso < cal.ini) { cal.fim = cal.ini; cal.ini = iso; }
      else { cal.fim = iso; }
      desenhaCal();
    }
    if (location.search.indexOf("calopen") >= 0) setTimeout(abreCal, 60);  // apoio de teste/print

    // abas
    const tabs = document.getElementById("tabs");
    const mk = (id, label, cls) => {
      const b = document.createElement("button");
      b.textContent = label; b.dataset.tab = id; if (cls) b.className = cls;
      b.onclick = () => { state.tab = id; render(); };
      tabs.appendChild(b);
    };
    mk("__agencia__", "Agência", "agencia");
    ACCTS.forEach(a => mk(a.client, a.client));

    // rodapé
    const notas = [];
    notas.push('<span class="leg"><span><span class="src m"></span> Meta (estimativa)</span><span><span class="src n"></span> Nosso (real)</span></span>');
    if (P && P.nota) notas.push(esc(P.nota));
    notas.push("Fonte: API de Marketing do Meta + fontes de venda por cliente · atualização automática a cada 2h · clique no cabeçalho pra ordenar.");
    document.getElementById("foot").innerHTML = notas.join("<br>");

    render();
  }

  /* ── render raiz ── */
  function render() {
    for (const k in _cacheJanela) delete _cacheJanela[k];   // datas podem ter mudado
    const custom = state.period === "custom";
    document.body.classList.toggle("custom-on", custom);
    if (custom) {
      const dIni = document.getElementById("dIni"), dFim = document.getElementById("dFim");
      if (dIni) dIni.value = state.cIni;
      if (dFim) dFim.value = state.cFim;
    }
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
    document.querySelectorAll("#calPresets button").forEach(b => b.classList.toggle("on", !custom && b.dataset.p === state.period));
    const calLbl = document.getElementById("calLbl");
    if (calLbl) calLbl.textContent = periodoLabel();
    const hp = custom ? `c:${state.cIni}:${state.cFim}` : state.period;
    try { history.replaceState(null, "", "#" + encodeURIComponent(state.tab) + "|" + hp); } catch (e) {}
    document.getElementById("view").innerHTML = state.tab === "__agencia__" ? renderAgencia() : renderClient(state.tab);
    wire();
  }

  function wire() {
    document.querySelectorAll("tr.clickable").forEach(tr =>
      tr.querySelector("td").onclick = () => { state.tab = tr.dataset.client; render(); });
    document.querySelectorAll("th[data-col]").forEach(th =>
      th.onclick = () => {
        const c = th.dataset.col;
        if (state.sortCol === c) state.sortDir = -state.sortDir; else { state.sortCol = c; state.sortDir = -1; }
        render();
      });
    document.querySelectorAll(".camp-controls .seg button").forEach(b =>
      b.onclick = () => { state.campFilter = b.dataset.f; render(); });
    const q = document.getElementById("campQuery");
    if (q) {
      q.oninput = () => {
        state.campQuery = q.value.trim().toLowerCase();
        renderCampArea();
      };
    }
  }

  /* ══════════ ABA AGÊNCIA ══════════ */
  function renderAgencia() {
    const rows = ACCTS.map(a => ({ a, m: am(a), p: pmOf(a.client) }));
    rows.sort((x, y) => (y.p.gasto || 0) - (x.p.gasto || 0));

    // totais
    const t = { gasto: 0, conversas: 0, vendas: 0, fat: 0 };
    let temEsperada = false;
    rows.forEach(({ a, p }) => {
      t.gasto += p.gasto || 0; t.conversas += p.conversas || 0;
      t.vendas += p.vendas || 0; t.fat += p.faturamento || 0;
      if ((PBY[a.client] || {}).receita_esperada && (p.faturamento || 0) > 0) temEsperada = true;
    });
    const tRoas = t.gasto ? t.fat / t.gasto : null;
    const tLucro = t.fat ? t.fat - t.gasto : null;
    const tTeto = t.conversas ? t.fat / t.conversas : null;
    const tCusto = t.conversas ? t.gasto / t.conversas : null;
    const tFolga = (tTeto && tCusto) ? tTeto / tCusto : null;

    const kpi = (k, v, sub, srcDot) => `<div class="kpi"><div class="v">${v}</div><div class="k">${srcDot ? `<span class="src ${srcDot}"></span>` : ""}${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
    const strip = `<div class="kpi-row" style="margin-top:18px">
      ${kpi("Investido", fMoney(t.gasto), null, "m")}
      ${kpi("Faturamento" + (temEsperada ? ' <span class="tag esp" title="inclui receita esperada (Bruna: honorários em caso de êxito)">inclui esperada</span>' : ""), fMoney(t.fat || null), null, "n")}
      ${kpi("Lucro", tLucro == null ? "—" : fMoney(tLucro), "faturamento − investimento")}
      ${kpi("ROAS da conta", fX(tRoas), "não atribuído ao anúncio")}
      ${kpi("Conversas", fInt(t.conversas || null), null, "m")}
      ${kpi("Vendas", fInt(t.vendas || null), null, "n")}
    </div>`;

    const body = rows.map(({ a, m, p }) => {
      const bd = m.results_breakdown || [];
      const resCell = bd.length
        ? bd.map(b => `<div>${fInt(b.value)} <span class="pill">${esc(b.label)}</span></div>`).join("")
        : "—";
      const cplCell = bd.length
        ? bd.map(b => `<div>${b.cost != null ? fMoney(b.cost, a.currency) : "—"}</div>`).join("")
        : "—";
      const esp = (PBY[a.client] || {}).receita_esperada && (p.faturamento || 0) > 0;
      return `<tr class="clickable" data-client="${esc(a.client)}">
        <td data-label="Cliente">${esc(a.client)}<span class="pill">${esc(a.label || "")}</span></td>
        <td data-label="Gasto">${fMoney(p.gasto, a.currency)}</td>
        <td data-label="Resultados">${resCell}</td>
        <td data-label="Custo/resultado">${cplCell}</td>
        <td data-label="Conversas">${fInt(p.conversas || null)}</td>
        <td data-label="Faturamento">${fMoney(p.faturamento || null, a.currency)}${esp ? ' <span class="tag esp" title="receita esperada em caso de êxito, não caixa">esperada</span>' : ""}</td>
        <td data-label="Vendas">${fInt(p.vendas || null)}</td>
        <td data-label="Ticket">${fMoney(p.ticket, a.currency)}</td>
        <td data-label="ROAS">${p.roas_conta != null && p.roas_conta > 0 ? fX(p.roas_conta) : (p.gasto && !p.faturamento ? '<span class="num-bad" title="gastando sem venda registrada">0×</span>' : "—")}</td>
        <td data-label="Folga">${folgaBadge(p)}</td>
      </tr>`;
    }).join("");

    const totalRow = `<tr class="total">
      <td data-label="">Total</td>
      <td data-label="Gasto">${fMoney(t.gasto)}</td>
      <td data-label="Resultados">—</td><td data-label="Custo/resultado">—</td>
      <td data-label="Conversas">${fInt(t.conversas || null)}</td>
      <td data-label="Faturamento">${fMoney(t.fat || null)}</td>
      <td data-label="Vendas">${fInt(t.vendas || null)}</td>
      <td data-label="Ticket">${fMoney(t.vendas ? t.fat / t.vendas : null)}</td>
      <td data-label="ROAS">${fX(tRoas)}</td>
      <td data-label="Folga">${folgaBadge({ folga: tFolga, teto_conversa: tTeto, custo_conversa: tCusto })}</td>
    </tr>`;

    return strip + `
      <h2 class="section">Clientes — ${periodoLabel()}</h2>
      <div class="table-wrap resp"><table>
        <thead><tr><th>Cliente</th><th><span class="src m"></span> Gasto</th><th><span class="src m"></span> Resultados</th><th>Custo/resultado</th><th><span class="src m"></span> Conversas</th><th><span class="src n"></span> Faturamento</th><th><span class="src n"></span> Vendas</th><th>Ticket</th><th>ROAS</th><th>Folga</th></tr></thead>
        <tbody>${body}${totalRow}</tbody></table></div>
      <p style="margin-top:10px;color:var(--muted-2);font-size:12px">Clique num cliente pra abrir campanhas, funil e economia das vendas.</p>`;
  }

  /* ══════════ ABA CLIENTE ══════════ */
  function renderClient(clientName) {
    const a = ACCTS.find(x => x.client === clientName);
    if (!a) return "";
    const m = am(a), p = pmOf(clientName);
    const acc = PBY[clientName] || {};
    const cur = a.currency;

    const head = `<div class="client-head"><h2>${esc(a.client)}</h2><span class="acc">${esc(a.label || "")} · act_${a.ad_account_id} · ${periodoLabel()}</span></div>`;

    /* herói */
    const heroHtml = hero(p, acc, cur);

    /* insight em linguagem simples */
    const ins = insight(p, acc, cur);
    const insightHtml = ins ? `<div class="insight ${ins.tone || ""}"><span class="kicker">Leitura rápida</span>${ins.txt}</div>` : "";

    /* KPIs — mídia (Meta) */
    const kpi = (k, v, sub, srcDot) => `<div class="kpi"><div class="v">${v}</div><div class="k">${srcDot ? `<span class="src ${srcDot}"></span>` : ""}${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
    const bd = m.results_breakdown || [];
    const midia = `<h2 class="section"><span class="src m"></span> Mídia — Meta</h2><div class="kpi-row">
      ${kpi("Gasto", fMoney(p.gasto != null ? p.gasto : m.spend, cur))}
      ${bd.slice(0, 3).map(b => kpi(esc(b.label) + (b.cost != null ? ` · ${fMoney(b.cost, cur)}/un` : ""), fInt(b.value))).join("") || kpi("Resultados", fInt(m.results))}
      ${kpi("CTR", fPct(m.ctr, 2))}
      ${kpi("CPM", fMoney(m.cpm, cur))}
      ${kpi("Conversas", fInt(p.conversas || null), "proxy da Meta até o webhook real")}
    </div>`;

    /* KPIs — vendas (nosso) */
    const espTag = acc.receita_esperada ? ' <span class="tag esp" title="honorários em caso de êxito — receita esperada, não caixa">esperada</span>' : "";
    const consultaLbl = acc.consulta_label ? (PLURAL[acc.consulta_label] || acc.consulta_label + "s") : null;
    const vendas = `<h2 class="section"><span class="src n"></span> Vendas — nosso dado</h2><div class="kpi-row">
      ${kpi("Faturamento" + espTag, fMoney(p.faturamento || null, cur), "caixa do período, não atribuído ao anúncio")}
      ${kpi("Vendas", fInt(p.vendas || null))}
      ${consultaLbl ? kpi(consultaLbl, fInt(p.consultas || null)) : ""}
      ${kpi("Ticket médio", fMoney(p.ticket, cur))}
      ${kpi("Custo por venda", fMoney(p.custo_venda, cur))}
      ${kpi("Margem", p.margem_pct != null ? fPct(p.margem_pct) : "—", p.lucro != null ? "lucro " + fMoney(p.lucro, cur) : null)}
      ${kpi("ROAS da conta", fX(p.roas_conta != null && p.roas_conta > 0 ? p.roas_conta : (p.faturamento ? p.roas_conta : null)))}
    </div>`;

    /* funil */
    const funnelHtml = funnel(p, acc);

    /* campanhas */
    const campArea = `<div id="campArea">${renderCamps(a)}</div>`;

    return head + heroHtml + insightHtml + midia + vendas + funnelHtml + campArea;
  }

  /* ── herói da folga (com variantes honestas) ── */
  function hero(p, acc, cur) {
    const g = p.gasto || 0, f = p.faturamento || 0, c = p.conversas || 0;
    if (!g && !f) {
      return `<section class="hero mut"><div class="hero-main">
        <div class="hero-kicker">Sem mídia no período</div>
        <div class="hero-num">—<small>nenhum investimento nem venda registrada</small></div>
      </div></section>`;
    }
    if (g && !f) {
      return `<section class="hero bad"><div class="hero-main">
        <div class="hero-kicker">Gastando sem venda registrada</div>
        <div class="hero-num">${fMoney(g, cur)}<small>investidos · ${fInt(c)} conversas${p.custo_conversa != null ? " · " + fMoney(p.custo_conversa, cur) + " por conversa" : ""}</small></div>
        <div class="hero-sub">Nenhuma venda registrada neste período na fonte deste cliente. Ou a venda ainda não aconteceu, ou não foi lançada.</div>
      </div></section>`;
    }
    if (!c || p.teto_conversa == null || p.custo_conversa == null) {
      const esp = acc.receita_esperada ? " (receita esperada)" : "";
      return `<section class="hero ${g ? "warn" : "mut"}"><div class="hero-main">
        <div class="hero-kicker">Venda no período${esp}</div>
        <div class="hero-num">${fMoney(f, cur)}<small>${fInt(p.vendas || null)} venda(s)${g ? " · " + fMoney(g, cur) + " investidos" : " · sem mídia no período"}</small></div>
        <div class="hero-sub">Sem conversas registradas no período — teto por conversa e folga ficam indisponíveis.</div>
      </div></section>`;
    }
    // caso completo: gauge custo × teto
    const t = tone(p.folga);
    const max = Math.max(p.teto_conversa * 1.15, p.custo_conversa * 1.15);
    const fillW = Math.max(1.5, Math.min(100, p.custo_conversa / max * 100));
    const tickX = Math.min(98.5, p.teto_conversa / max * 100);
    const esp = acc.receita_esperada ? ' <span class="tag esp" title="teto calculado sobre receita esperada (êxito), não caixa">esperada</span>' : "";
    return `<section class="hero ${t}">
      <div class="hero-main">
        <div class="hero-kicker">Quanto custa uma conversa — e quanto ela aguenta${esp}</div>
        <div class="hero-num">${fMoney(p.custo_conversa, cur)}<small>por conversa hoje · teto de ${fMoney(p.teto_conversa, cur)} sem prejuízo</small></div>
        <div class="gauge"><div class="fill" style="width:${fillW.toFixed(1)}%"></div><div class="tick" style="left:${tickX.toFixed(1)}%"><label>teto ${fMoney(p.teto_conversa, cur)}</label></div></div>
        <div class="hero-sub">${p.folga >= 1
          ? `Folga de <b>${fX(p.folga)}</b> até o teto — ${p.folga >= 1.5 ? "dá pra escalar o investimento" : "margem apertada, escalar com cuidado"}.`
          : `A conversa custa <b>mais que o teto</b> — no ritmo atual, o anúncio dá prejuízo.`}</div>
      </div>
      <div class="hero-badge"><b>${fX(p.folga)}</b><span>folga</span></div>
    </section>`;
  }

  /* ── insight em linguagem simples ── */
  function insight(p, acc, cur) {
    const g = p.gasto || 0, f = p.faturamento || 0;
    if (!g && !f) return null;
    if (g && !f) {
      return { tone: "bad", txt: `Investiu <b>${fMoney(g, cur)}</b> e teve <b>${fInt(p.conversas || 0)}</b> conversas${p.custo_conversa != null ? ` (<b>${fMoney(p.custo_conversa, cur)}</b> cada)` : ""} — nenhuma venda registrada no período.` };
    }
    const verbo = acc.receita_esperada ? "deve valer" : "valeu";
    const parts = [];
    if (p.custo_venda != null && p.ticket != null) {
      parts.push(`Cada venda custou <b>${fMoney(p.custo_venda, cur)}</b> e ${verbo} <b>${fMoney(p.ticket, cur)}</b>${p.margem_pct != null ? ` — margem de <b>${fPct(p.margem_pct)}</b>` : ""}.`);
    } else if (f) {
      parts.push(`Entraram <b>${fMoney(f, cur)}</b> em vendas${g ? ` com <b>${fMoney(g, cur)}</b> investidos` : " sem mídia no período"}.`);
    }
    if (p.consultas_por_venda > 0 && acc.consulta_label) {
      const uma = p.consultas_por_venda === 1;
      const lbl = (uma ? acc.consulta_label : (PLURAL[acc.consulta_label] || acc.consulta_label + "s")).toLowerCase();
      parts.push(`${uma ? "É" : "São"} <b>${fDec(p.consultas_por_venda)}</b> ${lbl} pra fechar 1 venda.`);
    }
    if (p.teto_conversa != null && p.custo_conversa != null) {
      parts.push(`Dá pra pagar até <b>${fMoney(p.teto_conversa, cur)}</b> por conversa — hoje paga <b>${fMoney(p.custo_conversa, cur)}</b>, folga de <b>${fX(p.folga)}</b>.`);
    }
    if (acc.receita_esperada) parts.push(`<span style="color:var(--muted)">Receita esperada: honorários entram em caso de êxito.</span>`);
    return parts.length ? { txt: parts.join(" ") } : null;
  }

  /* ── funil + caminho por venda ── */
  function funnel(p, acc) {
    const vendas = p.vendas || 0, cur = acc.currency;
    const conversaTip = "Hoje é a contagem da Meta (proxy). Quando o webhook próprio ligar, vira a conversa qualificada que combinamos — mínimo de mensagens espalhadas, sem contar rajada.";
    const stages = [
      { k: "Cliques no link", v: p.cliques, src: "m" },
      { k: "Conversas iniciadas", v: p.conversas, src: "m", tip: conversaTip },
    ];
    const temConsulta = acc.consulta_label && (p.consultas || 0) > 0;
    if (temConsulta) stages.push({ k: PLURAL[acc.consulta_label] || acc.consulta_label + "s", v: p.consultas, src: "n", tip: acc.consulta_label + " agendada" });
    stages.push({ k: "Vendas", v: vendas, src: "n" });
    if (!stages.some(s => s.v)) return "";

    // (1) funil absoluto do período
    const parts = [];
    stages.forEach((s, i) => {
      if (i > 0) {
        const from = stages[i - 1].v || 0, to = s.v || 0;
        const okPct = from > 0 && to <= from;
        parts.push(`<div class="pass">${okPct ? `<b>${fPct(to / from * 100, to / from < 0.1 ? 1 : 0)}</b>` : "<b>—</b>"}passam${!okPct && to > from ? `<span title="as vendas do período não nascem só das conversas do período (ciclo longo / receita esperada)"> †</span>` : ""}</div>`);
      }
      parts.push(`<div class="stage"><div class="sv">${fInt(s.v || 0)}</div><div class="sk"><span class="src ${s.src}"></span>${esc(s.k)}${s.tip ? ` <span title="${esc(s.tip)}" style="cursor:help">ⓘ</span>` : ""}</div></div>`);
    });
    const funilAbs = `<div class="funnel">${parts.join("")}</div>`;

    // (2) caminho POR VENDA — "quantos de cada pra fechar 1 venda"
    const pv = (x) => x == null ? "—" : (x >= 10 ? fInt(Math.round(x)) : fDec(Math.round(x * 10) / 10));
    const coerente = vendas > 0 && (p.conversas || 0) >= vendas && (p.cliques || 0) >= (p.conversas || 0);
    let caminho = "";
    if (coerente) {
      const temReuniao = acc.consulta_label && (p.consultas || 0) >= vendas && (p.consultas || 0) <= (p.conversas || 0);
      const s = [`<div class="path-step money"><b>${fMoney(p.custo_venda, cur)}</b><span>em anúncio</span></div>`];
      if (p.cliques) s.push(`<div class="path-step"><b>${pv(p.cliques / vendas)}</b><span>cliques no link</span></div>`);
      s.push(`<div class="path-step"><b>${pv(p.conversas / vendas)}</b><span>conversas iniciadas</span></div>`);
      if (temReuniao) s.push(`<div class="path-step"><b>${pv(p.consultas / vendas)}</b><span>${esc((PLURAL[acc.consulta_label] || acc.consulta_label + "s").toLowerCase())}</span></div>`);
      s.push(`<div class="path-step sale"><b>1</b><span>venda</span></div>`);
      caminho = `<div class="path-lead">Para fechar <b>1 venda</b>, o caminho no período:</div><div class="path">${s.join('<div class="path-arrow">→</div>')}</div>`;
    } else if (vendas > 0) {
      caminho = `<div class="path-lead">Cada venda custou <b>${fMoney(p.custo_venda, cur)}</b> em anúncio. <span style="color:var(--muted)">As vendas deste período não vêm só das conversas registradas nele (ciclo longo / receita esperada), então o caminho conversa→venda não fecha aqui.</span></div>`;
    }

    return `<h2 class="section">Funil do período</h2>${funilAbs}${caminho}`;
  }

  /* ── campanhas (nível Gerenciador) ── */
  function campFilterFn(c) {
    if (state.campFilter === "gasto" && !(c.spend > 0)) return false;
    if (state.campFilter === "ativas" && !/ACTIVE/i.test(c.status || "")) return false;
    if (state.campQuery && !(c.name || "").toLowerCase().includes(state.campQuery)) return false;
    return true;
  }

  function renderCamps(a) {
    const all = campsOf(a);
    const nGasto = all.filter(c => c.spend > 0).length;
    const nAtivas = all.filter(c => /ACTIVE/i.test(c.status || "")).length;
    const list = all.filter(campFilterFn).slice();

    list.sort((x, y) => {
      let vx = x[state.sortCol], vy = y[state.sortCol], base;
      if (typeof vx === "string" || typeof vy === "string") {
        vx = (vx == null ? "" : vx).toString().toLowerCase(); vy = (vy == null ? "" : vy).toString().toLowerCase();
        base = vx < vy ? -1 : vx > vy ? 1 : 0;
      } else base = (vx == null ? -Infinity : vx) - (vy == null ? -Infinity : vy);
      return base * state.sortDir;
    });

    const segBtn = (f, lbl, n) => `<button data-f="${f}" class="${state.campFilter === f ? "on" : ""}">${lbl} <span style="opacity:.6">${n}</span></button>`;
    const controls = `<div class="camp-controls">
      <div class="seg">${segBtn("gasto", "Com gasto", nGasto)}${segBtn("ativas", "Ativas", nAtivas)}${segBtn("todas", "Todas", all.length)}</div>
      <input type="search" id="campQuery" placeholder="Filtrar campanha…" value="${esc(state.campQuery)}">
    </div>`;

    const cell = (c, col) => {
      const v = c[col.key];
      switch (col.type) {
        case "status": {
          const on = /ACTIVE/i.test(v || ""), issue = /ISSUE/i.test(v || "");
          const lbl = on ? "Ativa" : /PAUSED/i.test(v || "") ? "Pausada" : /ARCHIV/i.test(v || "") ? "Arquivada" : (v || "—");
          return `<span class="st ${issue ? "issue" : on ? "on" : "off"}">${esc(lbl)}</span>`;
        }
        case "obj": return esc(OBJETIVOS[v] || v || "—");
        case "budget": return v == null ? "—" : fMoney(v, a.currency) + (c.budget_type ? `<span class="pill">${esc(c.budget_type)}</span>` : "");
        case "results": return fInt(v) + (c.result_type && c.result_type !== "—" ? `<span class="pill">${esc(c.result_type)}</span>` : "");
        case "money": return fMoney(v, a.currency);
        case "pct": return fPct(v, 2);
        case "x": return fX(v);
        case "int": return fInt(v);
        case "dec": return fDec(v);
        case "date": return fDate(v);
        default: return v == null || v === "" ? "—" : esc(v);
      }
    };

    const ths = COLS.map(c =>
      `<th data-col="${c.key}">${c.label}${state.sortCol === c.key ? ` <span class="arrow">${state.sortDir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("");
    const rows = list.map(c => "<tr>" + COLS.map(col => `<td>${cell(c, col)}</td>`).join("") + "</tr>").join("");
    const table = list.length
      ? `<div class="table-wrap camp-table"><table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">${state.campQuery ? "Nenhuma campanha bate com o filtro." : state.campFilter === "gasto" ? "Nenhuma campanha com gasto neste período." : "Nada aqui."}</div>`;

    // cards (mobile)
    const cards = list.slice(0, 30).map(c => {
      const on = /ACTIVE/i.test(c.status || "");
      return `<div class="camp-card">
        <div class="cc-head"><span class="cc-name">${esc(c.name)}</span><span class="st ${on ? "on" : "off"}">${on ? "Ativa" : "Pausada"}</span></div>
        <div class="cc-grid">
          <div><b>${fMoney(c.spend, a.currency)}</b><span>Gasto</span></div>
          <div><b>${fInt(c.results)}</b><span>${esc(c.result_type && c.result_type !== "—" ? c.result_type : "Resultados")}</span></div>
          <div><b>${fMoney(c.cpl, a.currency)}</b><span>Custo/resultado</span></div>
          <div><b>${fInt(c.conversas)}</b><span>Conversas</span></div>
          <div><b>${fInt(c.link_clicks)}</b><span>Cliques</span></div>
          <div><b>${fPct(c.ctr, 2)}</b><span>CTR</span></div>
        </div>
      </div>`;
    }).join("");
    const cardsWrap = list.length ? `<div class="camp-cards">${cards}${list.length > 30 ? `<div class="empty">+ ${list.length - 30} campanhas — use a busca pra achar uma específica.</div>` : ""}</div>` : "";

    return `<h2 class="section">Campanhas <span class="cnt">${list.length} de ${all.length}</span></h2>` + controls + table + cardsWrap;
  }

  // re-render só da área de campanhas (busca não pode perder o foco do input)
  function renderCampArea() {
    const a = ACCTS.find(x => x.client === state.tab);
    const area = document.getElementById("campArea");
    if (!a || !area) return;
    const q = document.getElementById("campQuery");
    const pos = q ? q.selectionStart : null;
    area.innerHTML = renderCamps(a);
    wire();
    const q2 = document.getElementById("campQuery");
    if (q2) { q2.focus(); if (pos != null) q2.setSelectionRange(pos, pos); }
  }

  init();
})();
</script>
</body>
</html>
