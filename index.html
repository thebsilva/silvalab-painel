<script>
(function () {
  "use strict";
  const D = window.DASHBOARD_DATA || null;
  const P = window.PAINEL_DATA || null;
  const DD = window.DIARIO_DATA || null;           // métricas POR DIA (janela livre)
  const DIDX = {};                                  // campo -> posição no vetor diário
  ((DD && DD.campos) || []).forEach((c, i) => { DIDX[c] = i; });
  const DDBY = {};                                  // client -> conta diária
  ((DD && DD.accounts) || []).forEach(a => { DDBY[a.client] = a; });
  const CV = window.CONVERSAS_DATA || null;         // conversas de VERDADE por dia (webhook)
  const CVBY = (CV && CV.clientes) || {};           // client -> {dias:{data:{conversas,...}}}
  const temConversaReal = (client) => !!(CVBY[client] && CVBY[client].dias && Object.keys(CVBY[client].dias).length);

  const PERIOD_LABELS = {
    today: "Hoje", yesterday: "Ontem", last_7d: "7 dias", last_14d: "14 dias",
    last_30d: "30 dias", this_month: "Este mês", last_month: "Mês passado", maximum: "Tudo",
    custom: "Personalizado",
  };
  const OBJETIVOS = {
    OUTCOME_SALES: "Vendas", OUTCOME_TRAFFIC: "Tráfego", OUTCOME_LEADS: "Leads",
    OUTCOME_ENGAGEMENT: "Engajamento", OUTCOME_AWARENESS: "Reconhecimento",
    OUTCOME_APP_PROMOTION: "Promoção de app", MESSAGES: "Mensagens", LINK_CLICKS: "Tráfego",
    CONVERSIONS: "Conversões", POST_ENGAGEMENT: "Engajamento", LEAD_GENERATION: "Cadastros",
    REACH: "Alcance", VIDEO_VIEWS: "Vídeo",
  };
  const PLURAL = { "Reunião": "Reuniões", "Avaliação": "Avaliações", "Análise": "Análises" };
  // Pixel/dataset a MARCAR ao publicar campanha de WhatsApp (CTWA) — nome no Events Manager.
  // Fonte: ref-pixel-rastreio-por-cliente (verificado ao vivo 04/07/2026).
  const PIXEIS = {
    "Paola Bones": "Silva Lab | Paola Bones",
    "Marcelle Lima": "Silva Lab | Marcelle Lima",
    "Studio NL": "Silva Lab | Studio NL",
    "Sofia Scherer": "Silva Lab | Sofia Scherer",
  };

  // Colunas da tabela de campanhas (nível Gerenciador — mostrar tudo)
  const COLS = [
    { key: "name",          label: "Campanha",        type: "text" },
    { key: "status",        label: "Status",          type: "status" },
    { key: "objective",     label: "Objetivo",        type: "obj" },
    { key: "budget",        label: "Orçamento",       type: "budget" },
    { key: "spend",         label: "Valor usado",     type: "money" },
    { key: "created",       label: "Criação",         type: "date" },
    { key: "frequency",     label: "Freq.",           type: "dec" },
    { key: "impressions",   label: "Impressões",      type: "int" },
    { key: "reach",         label: "Alcance",         type: "int" },
    { key: "profile_visits",label: "Visitas perfil",  type: "int" },
    { key: "link_clicks",   label: "Cliques no link", type: "int" },
    { key: "conversas",     label: "Conversas",       type: "int" },
    { key: "followers",     label: "Seguidores",      type: "int" },
    { key: "cpm",           label: "CPM",             type: "money" },
    { key: "ctr",           label: "CTR",             type: "pct" },
    { key: "cost_conversa", label: "Custo/conversa",  type: "money" },
    { key: "results",       label: "Resultados",      type: "results" },
    { key: "leads",         label: "Leads",           type: "int" },
    { key: "compras",       label: "Compras",         type: "int" },
    { key: "conversion_value", label: "Valor conv.",  type: "money" },
    { key: "roas",          label: "ROAS",            type: "x" },
    { key: "cost_purchase", label: "Custo/compra",    type: "money" },
    { key: "profit",        label: "Lucro Vendas",    type: "money" },
    { key: "page_views",    label: "Visitas página",  type: "int" },
  ];

  /* ── formatação pt-BR ── */
  const fMoney = (v, cur) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { style: "currency", currency: cur || "BRL" }).format(v);
  const fInt = (v) => v == null ? "—" : new Intl.NumberFormat("pt-BR").format(v);
  const fPct = (v, d) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: d == null ? 1 : d }).format(v) + "%";
  const fX = (v) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(v) + "×";
  const fDec = (v) => v == null ? "—" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(v);
  const fDate = (s) => { if (!s) return "—"; const [y, m, d] = s.split("-"); return (d && m) ? `${d}/${m}/${y.slice(2)}` : s; };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ── estado ── */
  const ACCTS = D && Array.isArray(D.accounts) ? D.accounts.filter(a => a.ok !== false) : [];
  const PBY = {}; ((P && P.accounts) || []).forEach(a => { PBY[a.client] = a; });
  const PERIODS = ((P && P.periods) || (D && D.periods) || []).slice();
  if (DD && !PERIODS.includes("custom")) PERIODS.push("custom");  // janela livre
  const hojeISO = new Date().toISOString().slice(0, 10);
  const DESDE = (DD && DD.desde) || "2026-01-01";
  const state = { period: "this_month", tab: "__agencia__", campFilter: "gasto", campQuery: "", sortCol: "spend", sortDir: -1,
                  cIni: hojeISO.slice(0, 8) + "01", cFim: hojeISO };

  if (!PERIODS.includes(state.period)) state.period = PERIODS[0] || "this_month";

  // restaura do hash (#aba|periodo  ou  #aba|c:2026-02-01:2026-03-15)
  try {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) {
      const [t, p] = h.split("|");
      if (t && (t === "__agencia__" || t === "__criativos__" || ACCTS.some(a => a.client === t))) state.tab = t;
      if (p && p.startsWith("c:") && DD) {
        const [, i, f] = p.split(":");
        if (i && f) { state.period = "custom"; state.cIni = i; state.cFim = f; }
      } else if (p && PERIODS.includes(p)) state.period = p;
    }
  } catch (e) { /* hash inválido — ignora */ }

  const fmtBR = (iso) => { const [y, m, d] = (iso || "").split("-"); return d ? `${d}/${m}/${y.slice(2)}` : iso; };
  const periodoLabel = () => state.period === "custom"
    ? `${fmtBR(state.cIni)} → ${fmtBR(state.cFim)}`
    : (PERIOD_LABELS[state.period] || state.period);

  /* ══ JANELA LIVRE: soma os dias no navegador (fonte: diario.js) ══ */
  const emJanela = (d) => d >= state.cIni && d <= state.cFim;

  function somaDias(dias) {                       // {data: vetor} -> {campo: soma}
    const s = {}; ((DD && DD.campos) || []).forEach(c => { s[c] = 0; });
    for (const d in (dias || {})) if (emJanela(d)) {
      const v = dias[d];
      for (const c in DIDX) s[c] += v[DIDX[c]] || 0;
    }
    s.spend = Math.round(s.spend * 100) / 100;
    s.conversion_value = Math.round(s.conversion_value * 100) / 100;
    return s;
  }

  function vendasJanela(client) {                 // vendas_dia do painel.js -> {consultas, vendas, faturamento}
    const dias = (PBY[client] || {}).vendas_dia || {};
    let c = 0, v = 0, f = 0;
    const prod = {};                              // venda por PRODUTO/frente (espelho do por_produto)
    for (const d in dias) if (emJanela(d)) {
      c += dias[d].c || 0; v += dias[d].v || 0; f += dias[d].f || 0;
      const pp = dias[d].p || {};
      for (const k in pp) {
        const e = prod[k] || (prod[k] = { vendas: 0, faturamento: 0 });
        e.vendas += pp[k].v || 0; e.faturamento += pp[k].f || 0;
      }
    }
    for (const k in prod) prod[k].faturamento = Math.round(prod[k].faturamento * 100) / 100;
    return { consultas: c, vendas: v, faturamento: Math.round(f * 100) / 100, por_produto: prod };
  }

  /* frentes na JANELA LIVRE — mesma regra do frentes_periodo() do build_painel */
  function frentesJanela(client, camps, v, iniciadas, realizadas) {
    const cfg = (PBY[client] || {}).frentes_cfg;
    if (!cfg) return null;
    const div = (a, b) => b > 0 ? Math.round(a / b * 100) / 100 : null;
    const sobra = Object.assign({}, v.por_produto || {});
    const usados = new Set();
    const out = cfg.map(f => {
      const rx = f.campanhas ? new RegExp(f.campanhas, "i") : null;
      let gasto = 0, cliques = 0;
      camps.forEach((c, i) => {
        if (rx && rx.test(c.name || "")) { usados.add(i); gasto += c.spend || 0; cliques += c.link_clicks || 0; }
      });
      const pv = sobra[f.nome] || {}; delete sobra[f.nome];
      const vendas = pv.vendas || 0;
      const item = { nome: f.nome, gasto: Math.round(gasto * 100) / 100, cliques: cliques,
        vendas: vendas, faturamento: pv.faturamento || 0,
        custo_venda: div(gasto, vendas), cliques_por_venda: div(cliques, vendas) };
      if (f.canal === "whatsapp") { item.iniciadas = iniciadas; item.realizadas = realizadas; }
      return item;
    });
    let gR = 0, cR = 0;
    camps.forEach((c, i) => { if (!usados.has(i)) { gR += c.spend || 0; cR += c.link_clicks || 0; } });
    const vR = Object.values(sobra).reduce((a, x) => a + (x.vendas || 0), 0);
    const fR = Object.values(sobra).reduce((a, x) => a + (x.faturamento || 0), 0);
    if (gR > 0 || vR > 0) out.push({ nome: "Não classificado", gasto: Math.round(gR * 100) / 100, cliques: cR,
      vendas: vR, faturamento: Math.round(fR * 100) / 100, custo_venda: div(gR, vR), cliques_por_venda: div(cR, vR), resto: true });
    return out;
  }

  function somaWebhook(client, campo, ini, fim) { // soma um campo do webhook (contatos=iniciadas, conversas=realizadas) no range
    const dias = (CVBY[client] || {}).dias || {};
    let c = 0;
    for (const d in dias) if (d >= ini && d <= fim) c += dias[d][campo] || 0;
    return c;
  }

  // porta fiel do resolve_result do coletor (ads_collect.py) — decide a headline da campanha
  function resolveResult(og, dest, objective, m) {
    og = (og || "").toUpperCase(); dest = (dest || "").toUpperCase(); const obj = (objective || "").toUpperCase();
    const msg = ["WHATSAPP", "MESSENGER", "DIRECT"].some(x => dest.includes(x));
    const trafego = m.page_views > 0 ? ["Visitas à página", m.page_views] : ["Cliques no link", m.link_clicks];
    if (["REACH", "AD_RECALL_LIFT", "IMPRESSIONS"].includes(og)) return ["Alcance", null]; // alcance não soma por dia
    if (msg) {
      if (["OFFSITE_CONVERSIONS", "ONSITE_CONVERSIONS", "VALUE"].includes(og) && m.compras > 0) return ["Compras", m.compras];
      return ["Conversas", m.conversas];
    }
    if (og === "LANDING_PAGE_VIEWS") return ["Visitas à página", m.page_views];
    if (["LINK_CLICKS", "PROFILE_VISIT", "PROFILE_AND_PAGE_ENGAGEMENT", "POST_ENGAGEMENT", "PAGE_LIKES",
         "THRUPLAY", "TWO_SECOND_CONTINUOUS_VIDEO_VIEWS", "VIDEO_VIEWS", "EVENT_RESPONSES"].includes(og)) return ["Cliques no link", m.link_clicks];
    if (["LEAD_GENERATION", "QUALITY_LEAD", "SUBSCRIBERS"].includes(og)) return m.leads > 0 ? ["Leads", m.leads] : trafego;
    if (["OFFSITE_CONVERSIONS", "ONSITE_CONVERSIONS", "VALUE"].includes(og)) {
      if (m.compras > 0) return ["Compras", m.compras];
      if (m.leads > 0) return ["Leads", m.leads];
      return trafego;
    }
    if (og === "CONVERSATIONS" || obj.includes("TRAFFIC")) return trafego;
    if (m.compras > 0) return ["Compras", m.compras];
    if (m.conversas > 0) return ["Conversas", m.conversas];
    if (m.leads > 0) return ["Leads", m.leads];
    return (m.page_views > 0 || m.link_clicks > 0) ? trafego : ["—", 0];
  }

  function breakdownJS(camps) {                   // mix da conta (porta do account_breakdown)
    const grp = {}, ordem = ["Compras", "Conversas", "Leads", "Leads (site)", "Visitas à página", "Cliques no link"];
    camps.forEach(c => {
      const l = c.result_type;
      if (!l || l === "—" || l === "Alcance" || !(c.results > 0)) return;
      const g = grp[l] || (grp[l] = { label: l, value: 0, spend: 0 });
      g.value += c.results; g.spend += c.spend || 0;
    });
    return ordem.filter(l => grp[l]).map(l => ({
      label: l, value: grp[l].value,
      cost: grp[l].value ? Math.round(grp[l].spend / grp[l].value * 100) / 100 : null,
    }));
  }

  function campSintetica(cid, cdata, cat) {       // campanha na janela livre (colunas do Gerenciador)
    const s = somaDias(cdata.dias);
    if (!Object.values(s).some(v => v)) return null;
    const meta = cat[cid] || {};
    const [label, val] = resolveResult(meta.opt_goal, meta.dest, meta.objective, s);
    const div = (a, b) => b > 0 ? Math.round(a / b * 100) / 100 : null;
    return {
      id: cid, name: meta.name || "(campanha)", status: meta.status || "—",
      objective: meta.objective || "—", budget: meta.budget == null ? null : meta.budget,
      budget_type: meta.budget_type || "—", created: meta.created || "",
      spend: s.spend, impressions: s.impressions, clicks: s.clicks, link_clicks: s.link_clicks,
      reach: null, frequency: null,               // não somáveis por dia — honestidade
      ctr: div(s.clicks * 100, s.impressions), cpc: div(s.spend, s.clicks), cpm: div(s.spend * 1000, s.impressions),
      conversas: s.conversas, cost_conversa: div(s.spend, s.conversas),
      leads: s.leads, compras: s.compras, conversion_value: s.conversion_value,
      cost_purchase: div(s.spend, s.compras), roas: div(s.conversion_value, s.spend),
      profit: s.conversion_value ? Math.round((s.conversion_value - s.spend) * 100) / 100 : null,
      page_views: s.page_views, profile_visits: s.profile_visits, followers: s.followers,
      result_type: label, results: val == null ? null : Math.round(val), cpl: val > 0 ? div(s.spend, val) : null,
    };
  }

  const _cacheJanela = {};                        // client -> {am, pm, camps} (limpo a cada render)
  function janelaDe(client) {
    if (_cacheJanela[client]) return _cacheJanela[client];
    const dd = DDBY[client];
    const div = (a, b) => b > 0 ? Math.round(a / b * 100) / 100 : null;
    const pct = (a, b) => b > 0 ? Math.round(a / b * 1000) / 10 : null;
    const vazio = { am: {}, pm: {}, camps: [] };
    if (!dd) return (_cacheJanela[client] = vazio);
    const s = somaDias(dd.dias);
    // mesmas regras do build_painel: onde o webhook cobre, INICIADAS e REALIZADAS vêm ambas
    // dele na MESMA janela; herói usa realizadas só com a janela TODA coberta (senão Meta).
    const cvDesde = (CVBY[client] || {}).desde || "9999";
    const cobre = temConversaReal(client) && state.cFim >= cvDesde;
    const totalCoberto = cobre && state.cIni >= cvDesde;
    let iniciadas, iniFonte, realizadas, janelaDesde;
    if (cobre) {
      const j0 = state.cIni >= cvDesde ? state.cIni : cvDesde;
      iniciadas = somaWebhook(client, "contatos", j0, state.cFim); iniFonte = "real";
      realizadas = somaWebhook(client, "conversas", j0, state.cFim);
      janelaDesde = state.cIni < cvDesde ? j0 : null;
    } else {
      iniciadas = s.conversas; iniFonte = "meta"; realizadas = null; janelaDesde = null;
    }
    const conversas = totalCoberto ? realizadas : s.conversas;
    const fonte = totalCoberto ? "real" : "meta";
    const camps = Object.entries(dd.campanhas || {})
      .map(([cid, c]) => campSintetica(cid, c, dd.catalogo || {}))
      .filter(Boolean).sort((a, b) => b.spend - a.spend);
    const bd = breakdownJS(camps);
    const am = {
      spend: s.spend, impressions: s.impressions, clicks: s.clicks, link_clicks: s.link_clicks,
      reach: null, frequency: null,
      ctr: div(s.clicks * 100, s.impressions), cpc: div(s.spend, s.clicks), cpm: div(s.spend * 1000, s.impressions),
      conversas: conversas, conversas_fonte: fonte, results_breakdown: bd,
      result_type: bd.length ? bd[0].label : "—", results: bd.length ? bd[0].value : 0,
      cpl: bd.length ? bd[0].cost : null,
      roas: div(s.conversion_value, s.spend), profit: s.conversion_value ? Math.round((s.conversion_value - s.spend) * 100) / 100 : null,
    };
    // métricas de negócio — mesmas fórmulas do build_painel.metricas()
    const v = vendasJanela(client);
    const teto = div(v.faturamento, conversas), custoConv = div(s.spend, conversas);
    const pm = {
      gasto: s.spend, conversas: conversas, conversas_fonte: fonte, leads: s.leads, cliques: s.link_clicks,
      vendas: v.vendas, faturamento: v.faturamento, consultas: v.consultas,
      ticket: div(v.faturamento, v.vendas), custo_venda: div(s.spend, v.vendas),
      lucro: v.faturamento ? Math.round((v.faturamento - s.spend) * 100) / 100 : null,
      margem_pct: v.faturamento ? pct(v.faturamento - s.spend, v.faturamento) : null,
      roas_conta: div(v.faturamento, s.spend),
      consultas_por_venda: div(v.consultas, v.vendas), taxa_conversao_pct: pct(v.vendas, v.consultas),
      teto_conversa: teto, custo_conversa: custoConv,
      folga: (teto && custoConv) ? Math.round(teto / custoConv * 100) / 100 : null,
      iniciadas: iniciadas, iniciadas_fonte: iniFonte,
      realizadas: realizadas, realizadas_fonte: realizadas == null ? "nenhuma" : "real",
      janela_desde: janelaDesde,
    };
    const fr = frentesJanela(client, camps, v, iniciadas, realizadas);
    if (fr) pm.frentes = fr;
    return (_cacheJanela[client] = { am, pm, camps });
  }

  const am = (a) => state.period === "custom" ? janelaDe(a.client).am
    : ((((a.periods || {})[state.period] || {}).account) || {});
  const pmOf = (client) => state.period === "custom" ? janelaDe(client).pm
    : (((((PBY[client] || {}).periods) || {})[state.period]) || {});
  const campsOf = (a) => state.period === "custom" ? janelaDe(a.client).camps
    : ((((a.periods || {})[state.period] || {}).campaigns) || []);

  /* ── nível da folga ── */
  const tone = (folga) => folga == null ? null : folga >= 1.5 ? "good" : folga >= 1 ? "warn" : "bad";
  const folgaBadge = (m) => {
    const t = tone(m.folga);
    return t ? `<span class="badge ${t}" title="teto ${fMoney(m.teto_conversa)} ÷ custo ${fMoney(m.custo_conversa)} por conversa">${fX(m.folga)}</span>` : "—";
  };

  /* ── init ── */
  function init() {
    if (!D || !ACCTS.length) {
      document.getElementById("view").innerHTML = '<div class="empty">Sem dados. Rode a coleta com o token.</div>';
      return;
    }
    // frescor (mídia)
    const el = document.getElementById("fresh");
    const dt = D.generated_at ? new Date(D.generated_at) : null;
    if (dt) {
      const h = (Date.now() - dt.getTime()) / 36e5;
      el.classList.add(h < 26 ? "ok" : h < 50 ? "warn" : "bad");
      el.lastElementChild.textContent = "atualizado " + (h < 1 ? "há menos de 1h" : h < 48 ? "há " + Math.round(h) + "h" : "em " + dt.toLocaleDateString("pt-BR"));
      el.title = dt.toLocaleString("pt-BR");
    } else el.style.display = "none";

    // ── seletor de período estilo Gerenciador: presets à esquerda + calendário ──
    const pop = document.getElementById("calPop"), btn = document.getElementById("calBtn");
    const pres = document.getElementById("calPresets");
    PERIODS.filter(p => p !== "custom").forEach(p => {
      const b = document.createElement("button");
      b.textContent = PERIOD_LABELS[p] || p; b.dataset.p = p;
      b.onclick = () => { state.period = p; fechaCal(); render(); };
      pres.appendChild(b);
    });
    const cal = { ini: null, fim: null, y: 0, m: 0 };   // estado do popover (pendente até Aplicar)
    const mesLbl = document.getElementById("calMes"), grid = document.getElementById("calGrid");
    const rngLbl = document.getElementById("calRange"), btnApply = document.getElementById("calApply");
    const ymMin = DESDE.slice(0, 7), ymMax = hojeISO.slice(0, 7);
    const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
                   "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

    function abreCal() {
      cal.ini = state.period === "custom" ? state.cIni : null;
      cal.fim = state.period === "custom" ? state.cFim : null;
      const ref = cal.fim || hojeISO;
      cal.y = +ref.slice(0, 4); cal.m = +ref.slice(5, 7) - 1;
      pop.hidden = false; desenhaCal();
    }
    function fechaCal() { pop.hidden = true; }
    btn.onclick = () => { pop.hidden ? abreCal() : fechaCal(); };
    document.addEventListener("click", (e) => {
      if (pop.hidden) return;
      // clique num dia re-desenha o grid: quando o evento chega aqui o alvo já foi
      // trocado (desconectado) e o closest() falharia -> NÃO é clique fora, ignora.
      if (!(e.target instanceof Element) || !e.target.isConnected) return;
      if (!e.target.closest(".cal-wrap")) fechaCal();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") fechaCal(); });
    document.getElementById("calCancel").onclick = fechaCal;
    document.getElementById("calPrev").onclick = () => { if (--cal.m < 0) { cal.m = 11; cal.y--; } desenhaCal(); };
    document.getElementById("calNext").onclick = () => { if (++cal.m > 11) { cal.m = 0; cal.y++; } desenhaCal(); };
    btnApply.onclick = () => {
      if (!cal.ini) return;
      state.period = "custom"; state.cIni = cal.ini; state.cFim = cal.fim || cal.ini;
      fechaCal(); render();
    };

    function desenhaCal() {
      const ym = `${cal.y}-${String(cal.m + 1).padStart(2, "0")}`;
      mesLbl.textContent = `${MESES[cal.m]} ${cal.y}`;
      document.getElementById("calPrev").disabled = ym <= ymMin;
      document.getElementById("calNext").disabled = ym >= ymMax;
      let html = ["S", "T", "Q", "Q", "S", "S", "D"].map(d => `<span class="wd">${d}</span>`).join("");
      const off = (new Date(cal.y, cal.m, 1).getDay() + 6) % 7;   // semana começa na segunda
      const nd = new Date(cal.y, cal.m + 1, 0).getDate();
      for (let i = 0; i < off; i++) html += `<button class="cal-day fora" tabindex="-1"></button>`;
      for (let d = 1; d <= nd; d++) {
        const iso = `${ym}-${String(d).padStart(2, "0")}`;
        const dis = iso < DESDE || iso > hojeISO;
        const edge = iso === cal.ini || iso === cal.fim;
        const dentro = cal.ini && cal.fim && iso > cal.ini && iso < cal.fim;
        html += `<button class="cal-day${dis ? " dis" : ""}${dentro ? " in" : ""}${edge ? " edge" : ""}"${dis ? " disabled" : ` data-d="${iso}"`}>${d}</button>`;
      }
      grid.innerHTML = html;
      rngLbl.textContent = cal.ini ? (fmtBR(cal.ini) + " → " + (cal.fim ? fmtBR(cal.fim) : "…")) : "escolha o início";
      btnApply.disabled = !cal.ini;
    }
    // delegação: o grid persiste entre re-desenhos (os botões de dia, não)
    grid.onclick = (e) => {
      const b = e.target.closest(".cal-day[data-d]");
      if (b) diaClick(b.dataset.d);
    };
    function diaClick(iso) {
      if (!cal.ini || (cal.ini && cal.fim)) { cal.ini = iso; cal.fim = null; }
      else if (iso < cal.ini) { cal.fim = cal.ini; cal.ini = iso; }
      else { cal.fim = iso; }
      desenhaCal();
    }
    if (location.search.indexOf("calopen") >= 0) setTimeout(abreCal, 60);  // apoio de teste/print

    // abas
    const tabs = document.getElementById("tabs");
    const mk = (id, label, cls) => {
      const b = document.createElement("button");
      b.textContent = label; b.dataset.tab = id; if (cls) b.className = cls;
      b.onclick = () => { state.tab = id; render(); };
      tabs.appendChild(b);
    };
    mk("__agencia__", "Visão geral", "agencia");
    ACCTS.forEach(a => mk(a.client, a.client));
    if (window.CRIATIVOS_DATA) mk("__criativos__", "Criativos", "criativos");

    // rodapé
    const notas = [];
    notas.push('<span class="leg"><span><span class="src m"></span> Meta (estimativa)</span><span><span class="src n"></span> Nosso (real)</span></span>');
    if (P && P.nota) notas.push(esc(P.nota));
    notas.push("Fonte: API de Marketing do Meta + fontes de venda por cliente · atualização automática a cada 2h · clique no cabeçalho pra ordenar.");
    document.getElementById("foot").innerHTML = notas.join("<br>");

    render();
  }

  /* ── render raiz ── */
  function render() {
    for (const k in _cacheJanela) delete _cacheJanela[k];   // datas podem ter mudado
    const custom = state.period === "custom";
    document.body.classList.toggle("custom-on", custom);
    if (custom) {
      const dIni = document.getElementById("dIni"), dFim = document.getElementById("dFim");
      if (dIni) dIni.value = state.cIni;
      if (dFim) dFim.value = state.cFim;
    }
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
    document.querySelectorAll("#calPresets button").forEach(b => b.classList.toggle("on", !custom && b.dataset.p === state.period));
    const calLbl = document.getElementById("calLbl");
    if (calLbl) calLbl.textContent = periodoLabel();
    const hp = custom ? `c:${state.cIni}:${state.cFim}` : state.period;
    try { history.replaceState(null, "", "#" + encodeURIComponent(state.tab) + "|" + hp); } catch (e) {}
    const ehCriativos = state.tab === "__criativos__";
    document.body.classList.toggle("criativos-on", ehCriativos);  // esconde o período (não se aplica: vida inteira)
    const view = document.getElementById("view");
    if (ehCriativos && window.renderCriativosTab) { window.renderCriativosTab(view); return; }
    view.innerHTML = state.tab === "__agencia__" ? renderAgencia() : renderClient(state.tab);
    wire();
  }

  function wire() {
    document.querySelectorAll("tr.clickable").forEach(tr =>
      tr.querySelector("td").onclick = () => { state.tab = tr.dataset.client; render(); });
    document.querySelectorAll("th[data-col]").forEach(th =>
      th.onclick = () => {
        const c = th.dataset.col;
        if (state.sortCol === c) state.sortDir = -state.sortDir; else { state.sortCol = c; state.sortDir = -1; }
        render();
      });
    document.querySelectorAll(".camp-controls .seg button").forEach(b =>
      b.onclick = () => { state.campFilter = b.dataset.f; render(); });
    document.querySelectorAll("[data-sim]").forEach(b =>
      b.onclick = () => abreEscala(b.dataset.sim));
    document.querySelectorAll("[data-open]").forEach(b =>
      b.onclick = () => { state.tab = b.dataset.open; render(); });
    const q = document.getElementById("campQuery");
    if (q) {
      q.oninput = () => {
        state.campQuery = q.value.trim().toLowerCase();
        renderCampArea();
      };
    }
  }

  /* ══════════ ABA AGÊNCIA ══════════ */
  function renderAgencia() {
    const all = ACCTS.map(a => ({ a, m: am(a), p: pmOf(a.client) }));
    // grupos: vendeu / só mídia (gasto sem venda) / parado (sem movimento) — mata o mar de "—"
    const vendeu = all.filter(r => (r.p.vendas || 0) > 0 || (r.p.faturamento || 0) > 0);
    const soMidia = all.filter(r => !vendeu.includes(r) && (r.p.gasto || 0) > 0);
    const parados = all.filter(r => !vendeu.includes(r) && !soMidia.includes(r));
    const byGasto = (x, y) => (y.p.gasto || 0) - (x.p.gasto || 0);
    vendeu.sort(byGasto); soMidia.sort(byGasto);

    // totais (conversas = INICIADAS, o único total com o mesmo significado pra todos)
    const t = { gasto: 0, iniciadas: 0, vendas: 0, fat: 0 };
    let temEsperada = false;
    all.forEach(({ a, p }) => {
      t.gasto += p.gasto || 0; t.iniciadas += p.iniciadas || 0;
      t.vendas += p.vendas || 0; t.fat += p.faturamento || 0;
      if ((PBY[a.client] || {}).receita_esperada && (p.faturamento || 0) > 0) temEsperada = true;
    });
    const tRoas = t.gasto ? t.fat / t.gasto : null;
    const tLucro = t.fat ? t.fat - t.gasto : null;

    /* faixa "o que fazer agora" — o conselheiro da carteira, priorizado */
    const acoes = [];
    all.forEach(({ a, p }) => {
      const g = p.gasto || 0, f = p.faturamento || 0;
      if (!g && !f) return;
      if (g && !f) acoes.push({ pri: 0, ord: g, cls: "r", ic: "⚠", cli: a.client, txt: `${fMoney(g, a.currency)} gastos sem venda registrada — revisar` });
      else if (p.folga != null && p.folga >= 1.5) acoes.push({ pri: 1, ord: p.folga, cls: "g", ic: "↑", cli: a.client, txt: `folga de ${fX(p.folga)} — dá pra escalar` });
      else if (p.folga != null && p.folga >= 1) acoes.push({ pri: 2, ord: p.folga, cls: "a", ic: "→", cli: a.client, txt: `folga de ${fX(p.folga)} — crescer com cuidado` });
      else if (p.folga != null) acoes.push({ pri: 0, ord: g, cls: "r", ic: "✋", cli: a.client, txt: `conversa custa mais que o teto (${fX(p.folga)}) — segurar` });
      else if (f) acoes.push({ pri: 3, ord: f, cls: "ok", ic: "✓", cli: a.client, txt: `vendeu ${fMoney(f, a.currency)}${g ? "" : " sem mídia no período"} — ok` });
    });
    acoes.sort((x, y) => x.pri - y.pri || y.ord - x.ord);
    const faixa = acoes.length ? `<h2 class="section" style="margin-top:18px">O que fazer agora <span class="cnt">· ${periodoLabel()}</span></h2>
      <div class="acoes">${acoes.map(x => `<button class="acao ${x.cls}" data-open="${esc(x.cli)}"><i>${x.ic}</i><span><b>${esc(x.cli)}</b> — ${x.txt}</span></button>`).join("")}</div>` : "";

    const kpi = (k, v, sub, srcDot) => `<div class="kpi"><div class="v">${v}</div><div class="k">${srcDot ? `<span class="src ${srcDot}"></span>` : ""}${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
    const strip = `<div class="kpi-row" style="margin-top:16px">
      ${kpi("Investido", fMoney(t.gasto), null, "m")}
      ${kpi("Faturamento" + (temEsperada ? ' <span class="tag esp" title="inclui receita esperada (Bruna: honorários em caso de êxito)">inclui esperada</span>' : ""), fMoney(t.fat || null), null, "n")}
      ${kpi("Lucro", tLucro == null ? "—" : fMoney(tLucro), "faturamento − investimento")}
      ${kpi("ROAS da conta", fX(tRoas), "não atribuído ao anúncio")}
      ${kpi("Conversas iniciadas", fInt(t.iniciadas || null), "webhook onde cobre; Meta no resto")}
      ${kpi("Vendas", fInt(t.vendas || null), null, "n")}
    </div>`;

    // Resultados: só o PRINCIPAL na coluna; o resto do mix no hover (+N)
    const rowHtml = ({ a, m, p }, comVenda) => {
      const bd = m.results_breakdown || [];
      const top = bd[0], resto = bd.slice(1);
      const maisTip = resto.map(b => `${fInt(b.value)} ${b.label}${b.cost != null ? ` · ${fMoney(b.cost, a.currency)}/un` : ""}`).join("\n");
      const resCell = top
        ? `${fInt(top.value)} <span class="pill">${esc(top.label)}</span>${resto.length ? ` <span class="mais" title="${esc(maisTip)}">+${resto.length}</span>` : ""}`
        : "—";
      const cplCell = top && top.cost != null ? fMoney(top.cost, a.currency) : "—";
      const esp = (PBY[a.client] || {}).receita_esperada && (p.faturamento || 0) > 0;
      const vendaCells = comVenda
        ? `<td data-label="Faturamento">${fMoney(p.faturamento || null, a.currency)}${esp ? ' <span class="tag esp" title="receita esperada em caso de êxito, não caixa">esperada</span>' : ""}</td>
        <td data-label="Vendas">${fInt(p.vendas || null)}</td>
        <td data-label="Ticket">${fMoney(p.ticket, a.currency)}</td>
        <td data-label="ROAS">${p.roas_conta != null && p.roas_conta > 0 ? fX(p.roas_conta) : "—"}</td>
        <td data-label="Folga">${folgaBadge(p)}</td>`
        : `<td class="nosale" colspan="5" data-label="">sem venda registrada no período</td>`;
      return `<tr class="clickable" data-client="${esc(a.client)}">
        <td data-label="Cliente">${esc(a.client)}<span class="pill">${esc(a.label || "")}</span></td>
        <td data-label="Gasto">${fMoney(p.gasto, a.currency)}</td>
        <td data-label="Resultado principal">${resCell}</td>
        <td data-label="Custo/resultado">${cplCell}</td>
        <td data-label="Conversas iniciadas">${fInt(p.iniciadas || null)}</td>
        ${vendaCells}
      </tr>`;
    };
    const ghead = (txt) => `<tr class="ghead"><td colspan="10" data-label="">${txt}</td></tr>`;
    let body = vendeu.map(r => rowHtml(r, true)).join("");
    if (soMidia.length) body += (vendeu.length ? ghead("Só mídia — sem venda registrada no período") : "") + soMidia.map(r => rowHtml(r, false)).join("");

    const totalRow = `<tr class="total">
      <td data-label="">Total</td>
      <td data-label="Gasto">${fMoney(t.gasto)}</td>
      <td data-label="Resultado principal">—</td><td data-label="Custo/resultado">—</td>
      <td data-label="Conversas iniciadas">${fInt(t.iniciadas || null)}</td>
      <td data-label="Faturamento">${fMoney(t.fat || null)}</td>
      <td data-label="Vendas">${fInt(t.vendas || null)}</td>
      <td data-label="Ticket">${fMoney(t.vendas ? t.fat / t.vendas : null)}</td>
      <td data-label="ROAS">${fX(tRoas)}</td>
      <td data-label="Folga">—</td>
    </tr>`;

    const paradosHtml = parados.length
      ? `<p class="parados">Sem movimento no período:${parados.map(({ a }) => ` <button data-open="${esc(a.client)}">${esc(a.client)}</button>`).join("")}</p>`
      : "";

    return faixa + strip + `
      <h2 class="section">Clientes — ${periodoLabel()}</h2>
      <div class="table-wrap resp"><table>
        <thead><tr><th>Cliente</th><th><span class="src m"></span> Gasto</th><th><span class="src m"></span> Resultado principal</th><th>Custo/resultado</th><th title="quem começou a conversa — webhook onde cobre, Meta no resto">Conversas iniciadas</th><th><span class="src n"></span> Faturamento</th><th><span class="src n"></span> Vendas</th><th>Ticket</th><th>ROAS</th><th>Folga</th></tr></thead>
        <tbody>${body}${totalRow}</tbody></table></div>${paradosHtml}
      <p style="margin-top:10px;color:var(--muted-2);font-size:12px">Clique num cliente pra abrir campanhas, funil e economia das vendas.</p>`;
  }

  /* ══════════ ABA CLIENTE ══════════ */
  /* ══════════ SIMULADOR DE ESCALA ══════════
     Projeta +20% / +30% / dobrar a verba com RENDIMENTO DECRESCENTE:
     o volume cresce por m^e (e<1), o custo unitário sobe por m^(1-e).
     Régua conservadora e=0,632 → dobrar a verba ≈ +55% de resultado. */
  const ESCALA_E = 0.632;
  const ESCALA_CEN = [
    { lbl: "Hoje", m: 1, hot: false },
    { lbl: "+20%", m: 1.2, hot: false },
    { lbl: "+30%", m: 1.3, hot: false },
    { lbl: "Dobrar", m: 2, hot: true },
  ];
  const svgTrend = () => `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>`;
  const svgWarn = () => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`;
  const svgInfo = () => `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>`;

  function escalavel(p) {
    if (!p || !(p.gasto > 0) || !((p.vendas || 0) > 0)) return false;
    return p.folga == null || p.folga >= 1;   // folga medida e <1 = a leitura já manda segurar, sem CTA de escala
  }

  // janela [ini, fim] de cada preset — espelho do janelas() do build_painel (last_Xd termina ONTEM)
  function boundsPreset(p) {
    const d = (iso, n) => { const t = new Date(iso + "T12:00:00"); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
    const ontem = d(hojeISO, -1), iniMes = hojeISO.slice(0, 8) + "01";
    switch (p) {
      case "today": return [hojeISO, hojeISO];
      case "yesterday": return [ontem, ontem];
      case "last_7d": return [d(hojeISO, -7), ontem];
      case "last_14d": return [d(hojeISO, -14), ontem];
      case "last_30d": return [d(hojeISO, -30), ontem];
      case "this_month": return [iniMes, hojeISO];
      case "last_month": { const fim = d(iniMes, -1); return [fim.slice(0, 8) + "01", fim]; }
      default: return [DESDE, hojeISO];   // "tudo" -> recorta pro histórico diário (o que dá pra mensalizar)
    }
  }

  // agrega o diário numa janela ARBITRÁRIA (reusa janelaDe trocando a janela do estado por um instante)
  function aggJanela(client, ini, fim) {
    const pi = state.cIni, pf = state.cFim, cacheAntes = _cacheJanela[client];
    state.cIni = ini; state.cFim = fim; delete _cacheJanela[client];
    const pm = janelaDe(client).pm;
    state.cIni = pi; state.cFim = pf;
    if (cacheAntes) _cacheJanela[client] = cacheAntes; else delete _cacheJanela[client];
    return pm;
  }

  /* base do simulador: (1) últimos 30 dias se sustentam projeção; senão (2) o PERÍODO QUE O
     BRUNO ESTÁ OLHANDO, mensalizado (média de 30 dias) — responde "estou filtrando o ano todo,
     como não posso saber a escala?"; senão (3) null -> estado vazio honesto. */
  function baseEscala(client) {
    const p30 = (((PBY[client] || {}).periods) || {}).last_30d || {};
    if ((p30.gasto || 0) > 0 && (p30.vendas || 0) > 0)
      return { b: p30, vendasReais: p30.vendas, fator: 1, lbl: "últimos 30 dias" };
    const [i0, fim] = state.period === "custom" ? [state.cIni, state.cFim] : boundsPreset(state.period);
    const ini = i0 < DESDE ? DESDE : i0;
    const bj = aggJanela(client, ini, fim);
    if ((bj.gasto || 0) > 0 && (bj.vendas || 0) > 0) {
      const dias = Math.max(1, Math.round((new Date(fim + "T12:00:00") - new Date(ini + "T12:00:00")) / 864e5) + 1);
      const f = 30 / dias;
      const b = { gasto: (bj.gasto || 0) * f, vendas: (bj.vendas || 0) * f, faturamento: (bj.faturamento || 0) * f,
                  cliques: (bj.cliques || 0) * f, conversas: (bj.conversas || 0) * f, consultas: (bj.consultas || 0) * f };
      return { b, vendasReais: bj.vendas, fator: f, lbl: `média mensal de ${fmtBR(ini)} → ${fmtBR(fim)}`, ini, fim };
    }
    return null;
  }

  function escalaCenarios(b, vendasReais) {
    const g0 = b.gasto || 0, v0 = b.vendas || 0, f0 = b.faturamento || 0;
    const cq0 = b.cliques || 0, cv0 = b.conversas || 0, co0 = b.consultas || 0;
    const fraca = vendasReais <= 2;            // amostra = contagem CRUA do período (1–2 vendas não formam taxa)
    return ESCALA_CEN.map(c => {
      const fv = Math.pow(c.m, ESCALA_E), g = g0 * c.m;
      const fat = f0 * fv, vendas = v0 * fv;
      return {
        lbl: c.lbl, hot: c.hot, m: c.m, gasto: g,
        cliques: cq0 * fv, conversas: cv0 * fv, consultas: co0 * fv,
        vendas: fraca ? null : vendas,
        faturamento: fraca ? null : fat,
        custo_clique: cq0 ? g / (cq0 * fv) : null,
        custo_conversa: cv0 ? g / (cv0 * fv) : null,
        custo_venda: (!fraca && v0) ? g / vendas : null,
        folga: (!fraca && g) ? fat / g : null,
        d_fat: (!fraca && f0) ? (fat - f0) / f0 : null,
      };
    });
  }

  function recoEscala(b, cens, acc, vendasReais) {
    if (vendasReais <= 2)
      return { alvo: "+20%", txt: "Poucos dados de venda pra prever com segurança. Suba pouco — +20% — e reavalie no mês que vem, quando houver mais fechamentos pra medir a taxa real." };
    if (acc.receita_esperada)
      return { alvo: "+30%", txt: "A receita aqui é esperada (honorários em caso de êxito), não caixa. Cresça firme, mas sem apostar alto numa entrada condicional: +30% é o passo seguro." };
    const dob = cens.find(c => c.m === 2);
    if (dob && dob.folga != null && dob.folga >= 1.5)
      return { alvo: "Dobrar", txt: "A folga sobra mesmo dobrando a verba. Dá pra ir agressivo — mas suba em duas etapas e confira o custo por conversa a cada passo." };
    return { alvo: "+30%", txt: "+30% mantém a margem confortável; dobrar já aperta a folga além do seguro." };
  }

  function renderEscala(client) {
    const a = ACCTS.find(x => x.client === client) || {};
    const acc = PBY[client] || {};
    const cur = a.currency || "BRL";
    const base = baseEscala(client);
    const head = (lbl) => `<div class="sim-head"><div><div class="sim-title">${svgTrend()} Simulador de escala</div>
      <div class="sim-sub">${esc(a.label || client)} · base: ${lbl} · projeção mensal</div></div>
      <button class="sim-close" id="simClose" aria-label="Fechar">✕</button></div>`;

    if (!base) {
      return `<div class="sim-panel" role="dialog" aria-label="Simulador de escala">${head("—")}
        <div class="sim-empty">Não achei gasto e venda juntos nem nos últimos 30 dias, nem no período que você está olhando (${periodoLabel()}). Quando houver venda registrada num período com mídia, os cenários aparecem aqui.</div></div>`;
    }

    const b = base.b;
    const cens = escalaCenarios(b, base.vendasReais);
    const fraca = base.vendasReais <= 2;
    const consultaLbl = acc.consulta_label ? (PLURAL[acc.consulta_label] || acc.consulta_label + "s") : null;
    const dob = cens.find(c => c.m === 2);

    const thead = `<tr><th></th>${cens.map(c => `<th class="${c.hot ? "sim-col-hot" : ""}">${c.lbl}</th>`).join("")}</tr>`;
    const row = (label, fn, strong) => `<tr class="${strong ? "sim-strong" : ""}"><td>${label}</td>${
      cens.map(c => `<td class="${c.hot ? "sim-col-hot" : ""}">${fn(c)}</td>`).join("")}</tr>`;
    const up = ` <span class="sim-up">▲</span>`;

    const rows = [];
    rows.push(row("Orçamento/mês", c => fMoney(c.gasto, cur)));
    if (b.cliques) rows.push(row("Cliques", c => fInt(Math.round(c.cliques))));
    if (b.conversas) rows.push(row("Conversas", c => fInt(Math.round(c.conversas))));
    if (b.consultas && consultaLbl) rows.push(row(consultaLbl, c => fInt(Math.round(c.consultas))));
    if (!fraca) {
      rows.push(row("Vendas", c => fInt(Math.round(c.vendas))));
      rows.push(row("Faturamento/mês", c =>
        fMoney(c.faturamento, cur) + (c.d_fat ? `<span class="sim-delta">+${Math.round(c.d_fat * 100)}%</span>` : ""), true));
    }
    if (b.cliques) rows.push(row("Custo por clique" + up, c => c.custo_clique == null ? "—" : fMoney(c.custo_clique, cur)));
    if (b.conversas) rows.push(row("Custo por conversa" + up, c => c.custo_conversa == null ? "—" : fMoney(c.custo_conversa, cur)));
    if (!fraca) {
      rows.push(row("Custo por venda" + up, c => fMoney(c.custo_venda, cur)));
      rows.push(row("Folga até o teto", c => fX(c.folga)));
    }

    const lead = fraca
      ? `Só <b>${fInt(base.vendasReais)}</b> ${base.vendasReais === 1 ? "venda" : "vendas"} no período — poucos dados pra projetar faturamento com honestidade. Mostro o crescimento das <b>conversas</b> (que respondem ao gasto); a venda fica pra reavaliar com mais histórico.`
      : `Dobrando a verba (+100%) o faturamento sobe <b>~${Math.round((dob.d_fat || 0) * 100)}%</b>, não 100% — cada conversa nova custa mais caro.`;

    const alerts = [];
    if (!fraca && dob && dob.vendas != null)
      alerts.push(`Dobrar projeta <b>~${fInt(Math.round(dob.vendas))} vendas/mês</b> (hoje ~${fInt(Math.round(cens[0].vendas))}). Confira se a operação dá conta do atendimento antes de escalar.`);

    const notes = [];
    if (base.fator !== 1) notes.push(`<b>Base mensalizada:</b> não houve venda nos últimos 30 dias, então usei o período que você está olhando (${fmtBR(base.ini)} → ${fmtBR(base.fim)}) dividido em média de 30 dias — o ritmo médio dele.`);
    notes.push(`<b>Rendimento decrescente embutido:</b> cada real novo traz menos conversa, por isso a verba dobra mas o faturamento não.`);
    if (acc.receita_esperada) notes.push(`<b>Receita esperada:</b> os valores são honorários em caso de êxito, não caixa garantido.`);
    notes.push(`<b>Projeção otimista:</b> assume a mesma taxa de fechamento de hoje; escalar rápido costuma piorar o custo por conversa.`);

    const reco = recoEscala(b, cens, acc, base.vendasReais);
    return `<div class="sim-panel" role="dialog" aria-label="Simulador de escala — ${esc(client)}">
      ${head(base.lbl)}
      <div class="sim-lead">${lead}</div>
      <div class="sim-tw"><table class="sim-table"><thead>${thead}</thead><tbody>${rows.join("")}</tbody></table></div>
      ${alerts.map(t => `<div class="sim-alert">${svgWarn()}<span>${t}</span></div>`).join("")}
      <div class="sim-reco"><span class="k">Recomendação</span><div class="big">${esc(reco.alvo)}</div><p>${reco.txt}</p></div>
      <div class="sim-notes">${notes.map(n => `<div class="sim-note">${svgInfo()}<span>${n}</span></div>`).join("")}</div>
    </div>`;
  }

  let _simEsc = null;
  function abreEscala(client) {
    const root = document.getElementById("simRoot");
    if (!root) return;
    root.innerHTML = `<div class="sim-overlay" id="simOverlay">${renderEscala(client)}</div>`;
    const ov = document.getElementById("simOverlay");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => ov && ov.classList.add("open"));
    const cl = document.getElementById("simClose");
    if (cl) cl.onclick = fechaEscala;
    ov.addEventListener("click", (e) => {
      // clique real borbulha DEPOIS do render; se o alvo já saiu do DOM, não é clique-fora
      if (!(e.target instanceof Element) || !e.target.isConnected) return;
      if (!e.target.closest(".sim-panel")) fechaEscala();
    });
    _simEsc = (e) => { if (e.key === "Escape") fechaEscala(); };
    document.addEventListener("keydown", _simEsc);
  }
  function fechaEscala() {
    const ov = document.getElementById("simOverlay");
    document.body.style.overflow = "";
    if (_simEsc) { document.removeEventListener("keydown", _simEsc); _simEsc = null; }
    if (ov) { ov.classList.remove("open"); setTimeout(() => { const r = document.getElementById("simRoot"); if (r) r.innerHTML = ""; }, 200); }
  }

  function renderClient(clientName) {
    const a = ACCTS.find(x => x.client === clientName);
    if (!a) return "";
    const m = am(a), p = pmOf(clientName);
    const acc = PBY[clientName] || {};
    const cur = a.currency;

    const head = `<div class="client-head"><h2>${esc(a.client)}</h2><span class="acc">${esc(a.label || "")} · act_${a.ad_account_id} · ${periodoLabel()}</span></div>`;

    /* referência: qual pixel marcar ao publicar (WhatsApp/CTWA) */
    const px = PIXEIS[clientName];
    const pixelRef = `<div class="pixel-ref${px ? "" : " pend"}"><span class="px-k">Pixel ao publicar</span>`
      + (px ? `<b>${esc(px)}</b><span class="px-note">campanha de WhatsApp (CTWA)</span>`
            : `<b>—</b><span class="px-note">sem pixel próprio ainda</span>`) + `</div>`;

    /* herói */
    const heroHtml = hero(p, acc, cur);

    /* insight em linguagem simples */
    const ins = insight(p, acc, cur);
    const insightHtml = ins ? `<div class="insight ${ins.tone || ""}"><span class="kicker">Leitura rápida</span>${ins.txt}</div>` : "";

    /* CTA do simulador — só quando há folga pra escalar e venda-base pra projetar */
    const escalaCta = escalavel(p)
      ? `<div><button class="sim-cta" data-sim="${esc(clientName)}">${svgTrend()} Ver cenários de escala</button></div>`
      : "";

    /* KPIs — mídia (Meta) */
    const kpi = (k, v, sub, srcDot) => `<div class="kpi"><div class="v">${v}</div><div class="k">${srcDot ? `<span class="src ${srcDot}"></span>` : ""}${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
    const bd = (m.results_breakdown || []).filter(b => b.label !== "Conversas");  // conversas têm cards próprios (iniciadas/realizadas)
    const jDesde = p.janela_desde ? ` · desde ${fDate(p.janela_desde)}` : "";
    const cardIniciadas = kpi("Conversas iniciadas", fInt(p.iniciadas || null),
      p.iniciadas_fonte === "real" ? "quem começou — nosso webhook" + jDesde : "quem começou — Meta",
      p.iniciadas_fonte === "real" ? "n" : "m");
    const cardRealizadas = p.realizadas == null
      ? kpi("Conversas realizadas", "—", "sem captura aqui — o webhook ligou depois", null)
      : kpi("Conversas realizadas", fInt(p.realizadas || null), "trocou ≥ mín. de msgs — nosso webhook" + jDesde, "n");
    const midia = `<h2 class="section"><span class="src m"></span> Mídia — Meta</h2><div class="kpi-row">
      ${kpi("Gasto", fMoney(p.gasto != null ? p.gasto : m.spend, cur))}
      ${bd.slice(0, 3).map(b => kpi(esc(b.label) + (b.cost != null ? ` · ${fMoney(b.cost, cur)}/un` : ""), fInt(b.value))).join("")}
      ${cardIniciadas}
      ${cardRealizadas}
      ${kpi("CTR", fPct(m.ctr, 2))}
      ${kpi("CPM", fMoney(m.cpm, cur))}
    </div>`;

    /* KPIs — vendas (nosso) */
    const espTag = acc.receita_esperada ? ' <span class="tag esp" title="honorários em caso de êxito — receita esperada, não caixa">esperada</span>' : "";
    const consultaLbl = acc.consulta_label ? (PLURAL[acc.consulta_label] || acc.consulta_label + "s") : null;
    const vendas = `<h2 class="section"><span class="src n"></span> Vendas — nosso dado</h2><div class="kpi-row">
      ${kpi("Faturamento" + espTag, fMoney(p.faturamento || null, cur), "caixa do período, não atribuído ao anúncio")}
      ${kpi("Vendas", fInt(p.vendas || null))}
      ${consultaLbl ? kpi(consultaLbl, fInt(p.consultas || null)) : ""}
      ${kpi("Ticket médio", fMoney(p.ticket, cur))}
      ${kpi("Custo por venda", fMoney(p.custo_venda, cur))}
      ${kpi("Margem", p.margem_pct != null ? fPct(p.margem_pct) : "—", p.lucro != null ? "lucro " + fMoney(p.lucro, cur) : null)}
      ${kpi("ROAS da conta", fX(p.roas_conta != null && p.roas_conta > 0 ? p.roas_conta : (p.faturamento ? p.roas_conta : null)))}
    </div>`;

    /* funil */
    const funnelHtml = funnel(p, acc);

    /* campanhas */
    const campArea = `<div id="campArea">${renderCamps(a)}</div>`;

    return head + pixelRef + heroHtml + insightHtml + escalaCta + midia + vendas + funnelHtml + campArea;
  }

  /* ── herói da folga (com variantes honestas) ── */
  function hero(p, acc, cur) {
    const g = p.gasto || 0, f = p.faturamento || 0, c = p.conversas || 0;
    if (!g && !f) {
      return `<section class="hero mut"><div class="hero-main">
        <div class="hero-kicker">Sem mídia no período</div>
        <div class="hero-num">—<small>nenhum investimento nem venda registrada</small></div>
      </div></section>`;
    }
    if (g && !f) {
      return `<section class="hero bad"><div class="hero-main">
        <div class="hero-kicker">Gastando sem venda registrada</div>
        <div class="hero-num">${fMoney(g, cur)}<small>investidos · ${fInt(c)} conversas${p.custo_conversa != null ? " · " + fMoney(p.custo_conversa, cur) + " por conversa" : ""}</small></div>
        <div class="hero-sub">Nenhuma venda registrada neste período na fonte deste cliente. Ou a venda ainda não aconteceu, ou não foi lançada.</div>
      </div></section>`;
    }
    if (!c || p.teto_conversa == null || p.custo_conversa == null) {
      const esp = acc.receita_esperada ? " (receita esperada)" : "";
      return `<section class="hero ${g ? "warn" : "mut"}"><div class="hero-main">
        <div class="hero-kicker">Venda no período${esp}</div>
        <div class="hero-num">${fMoney(f, cur)}<small>${fInt(p.vendas || null)} venda(s)${g ? " · " + fMoney(g, cur) + " investidos" : " · sem mídia no período"}</small></div>
        <div class="hero-sub">Sem conversas registradas no período — teto por conversa e folga ficam indisponíveis.</div>
      </div></section>`;
    }
    // caso completo: gauge custo × teto
    const t = tone(p.folga);
    const max = Math.max(p.teto_conversa * 1.15, p.custo_conversa * 1.15);
    const fillW = Math.max(1.5, Math.min(100, p.custo_conversa / max * 100));
    const tickX = Math.min(98.5, p.teto_conversa / max * 100);
    const esp = acc.receita_esperada ? ' <span class="tag esp" title="teto calculado sobre receita esperada (êxito), não caixa">esperada</span>' : "";
    return `<section class="hero ${t}">
      <div class="hero-main">
        <div class="hero-kicker">Quanto custa uma conversa — e quanto ela aguenta${esp}</div>
        <div class="hero-num">${fMoney(p.custo_conversa, cur)}<small>por conversa hoje · teto de ${fMoney(p.teto_conversa, cur)} sem prejuízo</small></div>
        <div class="gauge"><div class="fill" style="width:${fillW.toFixed(1)}%"></div><div class="tick" style="left:${tickX.toFixed(1)}%"><label>teto ${fMoney(p.teto_conversa, cur)}</label></div></div>
        <div class="hero-sub">${p.folga >= 1
          ? `Folga de <b>${fX(p.folga)}</b> até o teto — ${p.folga >= 1.5 ? "dá pra escalar o investimento" : "margem apertada, escalar com cuidado"}.`
          : `A conversa custa <b>mais que o teto</b> — no ritmo atual, o anúncio dá prejuízo.`}</div>
      </div>
      <div class="hero-badge"><b>${fX(p.folga)}</b><span>folga</span></div>
    </section>`;
  }

  /* ── insight em linguagem simples ── */
  function insight(p, acc, cur) {
    const g = p.gasto || 0, f = p.faturamento || 0;
    if (!g && !f) return null;
    if (g && !f) {
      return { tone: "bad", txt: `Investiu <b>${fMoney(g, cur)}</b> e teve <b>${fInt(p.conversas || 0)}</b> conversas${p.custo_conversa != null ? ` (<b>${fMoney(p.custo_conversa, cur)}</b> cada)` : ""} — nenhuma venda registrada no período. <b style="color:var(--red)">→ revisar a campanha: gasto sem retorno.</b>` };
    }
    const verbo = acc.receita_esperada ? "deve valer" : "valeu";
    const parts = [];
    if (p.custo_venda != null && p.ticket != null) {
      parts.push(`Cada venda custou <b>${fMoney(p.custo_venda, cur)}</b> e ${verbo} <b>${fMoney(p.ticket, cur)}</b>${p.margem_pct != null ? ` — margem de <b>${fPct(p.margem_pct)}</b>` : ""}.`);
    } else if (f) {
      parts.push(`Entraram <b>${fMoney(f, cur)}</b> em vendas${g ? ` com <b>${fMoney(g, cur)}</b> investidos` : " sem mídia no período"}.`);
    }
    if (p.consultas_por_venda > 0 && acc.consulta_label) {
      const uma = p.consultas_por_venda === 1;
      const lbl = (uma ? acc.consulta_label : (PLURAL[acc.consulta_label] || acc.consulta_label + "s")).toLowerCase();
      parts.push(`${uma ? "É" : "São"} <b>${fDec(p.consultas_por_venda)}</b> ${lbl} pra fechar 1 venda.`);
    }
    if (p.teto_conversa != null && p.custo_conversa != null) {
      parts.push(`Dá pra pagar até <b>${fMoney(p.teto_conversa, cur)}</b> por conversa — hoje paga <b>${fMoney(p.custo_conversa, cur)}</b>, folga de <b>${fX(p.folga)}</b>.`);
    }
    // fecha aconselhando (não só descrevendo) — o "braço direito"
    if (p.folga != null) {
      parts.push(p.folga >= 1.5
        ? `<b style="color:var(--green)">→ dá pra escalar o investimento aqui.</b>`
        : p.folga >= 1
        ? `<b style="color:var(--amber)">→ dá pra crescer, mas com margem apertada.</b>`
        : `<b style="color:var(--red)">→ segure: no ritmo atual a conversa custa mais que o teto.</b>`);
    }
    if (acc.receita_esperada) parts.push(`<span style="color:var(--muted)">Receita esperada: honorários entram em caso de êxito.</span>`);
    return parts.length ? { txt: parts.join(" ") } : null;
  }

  /* ── uma cadeia: etapas + % que passa + chip "por venda" (usada solta e por frente) ── */
  function cadeia(stages, vendas, custoVenda, cur) {
    const pv = (x) => x == null ? "—" : (x >= 10 ? fInt(Math.round(x)) : fDec(Math.round(x * 10) / 10));
    // só mostra "por venda" quando a corrente fecha: tem venda E cada etapa cabe na anterior
    const coerente = vendas > 0 && stages.every((s, i) => i === 0 || (s.v || 0) <= (stages[i - 1].v || 0));
    const parts = [];
    stages.forEach((s, i) => {
      if (i > 0) {
        const from = stages[i - 1].v || 0, to = s.v || 0;
        const okPct = from > 0 && to <= from;
        parts.push(`<div class="pass">${okPct ? `<b>${fPct(to / from * 100, to / from < 0.1 ? 1 : 0)}</b>` : "<b>—</b>"}passam${!okPct && to > from ? `<span title="as vendas do período não nascem só das conversas do período (ciclo longo / receita esperada)"> †</span>` : ""}</div>`);
      }
      let chip = "";
      if (coerente) {
        if (s.alvo) chip = custoVenda != null
          ? `<div class="spv"><i>custou ${fMoney(custoVenda, cur)}<small>em anúncio</small></i></div>`
          : `<div class="spv"><i>1<small>o alvo</small></i></div>`;
        else if ((s.v || 0) >= vendas) chip = `<div class="spv"><i>${pv(s.v / vendas)}<small>por venda</small></i></div>`;
      }
      parts.push(`<div class="stage${s.alvo ? " alvo" : ""}"><div class="sv">${fInt(s.v || 0)}</div><div class="sk"><span class="src ${s.src}"></span>${esc(s.k)}${s.tip ? ` <span title="${esc(s.tip)}" style="cursor:help">ⓘ</span>` : ""}</div>${chip}</div>`);
    });
    return { html: `<div class="funnel">${parts.join("")}</div>`, coerente };
  }

  /* ── funil POR FRENTE: cliente com 2+ linhas de negócio (ex. Bruna: Juros no site, Aéreo no
       WhatsApp). Sem isso o funil somava clique de uma frente com venda da outra. ── */
  function funnelFrentes(fr, p, acc) {
    const cur = acc.currency;
    const iniReal = p.iniciadas_fonte === "real";
    const jd = p.janela_desde ? ` Medidas desde ${fDate(p.janela_desde)} (início do webhook).` : "";
    // sobra irrelevante (ex.: campanha encerrada sem nome no catálogo da janela livre) não vira
    // bloco — mas NUNCA some calada: vira a nota do rodapé.
    const total = fr.reduce((a, f) => a + (f.gasto || 0), 0);
    const miudo = fr.filter(f => f.resto && !(f.vendas > 0) && (f.gasto || 0) < total * 0.01);
    const mostra = fr.filter(f => !miudo.includes(f));
    const blocos = mostra.map(f => {
      const stages = [{ k: "Cliques no link", v: f.cliques, src: "m" }];
      if (f.iniciadas != null) {
        stages.push({ k: "Conversas iniciadas", v: f.iniciadas, src: iniReal ? "n" : "m",
          tip: iniReal ? "Conversas iniciadas contadas pelo nosso webhook (quem mandou a 1ª mensagem)."
                       : "Conversas iniciadas pela contagem da Meta (proxy)." });
        if (f.realizadas != null) stages.push({ k: "Conversas realizadas", v: f.realizadas, src: "n",
          tip: "Trocou pelo menos o mínimo de mensagens espalhadas — nosso webhook." + jd });
      }
      stages.push({ k: "Vendas", v: f.vendas || 0, src: "n", alvo: true });

      const c = cadeia(stages, f.vendas || 0, f.custo_venda, cur);
      const canal = f.iniciadas != null ? "WhatsApp" : (f.resto ? "" : "site");
      const cab = `<div class="frente-cab"><b>${esc(f.nome)}</b>${canal ? `<span class="canal">${canal}</span>` : ""}` +
                  `<span class="verba">${fMoney(f.gasto, cur)} investidos</span></div>`;
      // a resposta que o funil existe pra dar: o que custa UMA venda nesta frente
      const lead = f.resto
        ? `<div class="frente-lead vazio">Campanhas <b>sem frente no nome</b> (em geral as antigas) — ficam fora dos caminhos acima até serem renomeadas ou mapeadas.</div>`
        : (f.vendas > 0 && c.coerente)
        ? `<div class="frente-lead">1 venda = <b>${f.cliques_por_venda >= 10 ? fInt(Math.round(f.cliques_por_venda)) : fDec(Math.round(f.cliques_por_venda * 10) / 10)} cliques</b> · <b>${fMoney(f.custo_venda, cur)}</b> em anúncio.</div>`
        : (f.vendas > 0
            ? `<div class="frente-lead">Cada venda custou <b>${fMoney(f.custo_venda, cur)}</b> em anúncio. <span style="color:var(--muted)">As vendas do período não nascem só das conversas dele (ciclo longo), então o caminho conversa→venda não fecha aqui.</span></div>`
            : `<div class="frente-lead vazio">Ainda <b>sem venda registrada</b> nesta frente — o caminho para antes do fim.</div>`);
      return `<div class="frente${f.vendas > 0 ? " tem-venda" : ""}">${cab}${c.html}${lead}</div>`;
    });
    const gm = miudo.reduce((a, f) => a + (f.gasto || 0), 0);
    const notaMiudo = gm > 0
      ? `<div class="frente-lead vazio" style="margin-top:2px">+ ${fMoney(gm, cur)} fora das frentes — campanha sem frente no nome ou diferença da própria Meta entre conta e campanhas.</div>`
      : "";
    return `<h2 class="section">Funil do período <span class="cnt">· por frente, o caminho pra fechar 1 venda</span></h2>${blocos.join("")}${notaMiudo}`;
  }

  /* ── funil do período — número + % que passa + "por venda", num bloco só ── */
  function funnel(p, acc) {
    const vendas = p.vendas || 0, cur = acc.currency;
    const frentes = (p.frentes || []).filter(f => (f.gasto || 0) > 0 || (f.vendas || 0) > 0);
    if (frentes.length > 1) return funnelFrentes(frentes, p, acc);
    const iniReal = p.iniciadas_fonte === "real";
    const iniTip = iniReal
      ? "Conversas iniciadas contadas pelo nosso webhook (quem mandou a 1ª mensagem)."
      : "Conversas iniciadas pela contagem da Meta (proxy). Onde o webhook cobre o período, passa a ser a contagem própria.";
    const jd = p.janela_desde ? ` Medidas desde ${fDate(p.janela_desde)} (início do webhook).` : "";
    const stages = [
      { k: "Cliques no link", v: p.cliques, src: "m" },
      { k: "Conversas iniciadas", v: p.iniciadas, src: iniReal ? "n" : "m", tip: iniTip },
    ];
    if (p.realizadas != null) stages.push({ k: "Conversas realizadas", v: p.realizadas, src: "n",
      tip: "Trocou pelo menos o mínimo de mensagens espalhadas — nosso webhook." + jd });
    const temConsulta = acc.consulta_label && (p.consultas || 0) > 0;
    if (temConsulta) stages.push({ k: PLURAL[acc.consulta_label] || acc.consulta_label + "s", v: p.consultas, src: "n", tip: acc.consulta_label + " agendada" });
    stages.push({ k: "Vendas", v: vendas, src: "n", alvo: true });
    if (!stages.some(s => s.v)) return "";

    const c = cadeia(stages, vendas, p.custo_venda, cur);

    // venda que não nasce do funil do período (ciclo longo / receita esperada): sem chips, com a nota
    const nota = (!c.coerente && vendas > 0)
      ? `<div class="path-lead">Cada venda custou <b>${fMoney(p.custo_venda, cur)}</b> em anúncio. <span style="color:var(--muted)">As vendas deste período não vêm só das conversas registradas nele (ciclo longo / receita esperada), então o caminho conversa→venda não fecha aqui.</span></div>`
      : "";

    return `<h2 class="section">Funil do período${c.coerente ? ' <span class="cnt">· e o caminho pra fechar 1 venda</span>' : ""}</h2>${c.html}${nota}`;
  }

  /* ── campanhas (nível Gerenciador) ── */
  function campFilterFn(c) {
    if (state.campFilter === "gasto" && !(c.spend > 0)) return false;
    if (state.campFilter === "ativas" && !/ACTIVE/i.test(c.status || "")) return false;
    if (state.campQuery && !(c.name || "").toLowerCase().includes(state.campQuery)) return false;
    return true;
  }

  function renderCamps(a) {
    const all = campsOf(a);
    const nGasto = all.filter(c => c.spend > 0).length;
    const nAtivas = all.filter(c => /ACTIVE/i.test(c.status || "")).length;
    const list = all.filter(campFilterFn).slice();

    list.sort((x, y) => {
      let vx = x[state.sortCol], vy = y[state.sortCol], base;
      if (typeof vx === "string" || typeof vy === "string") {
        vx = (vx == null ? "" : vx).toString().toLowerCase(); vy = (vy == null ? "" : vy).toString().toLowerCase();
        base = vx < vy ? -1 : vx > vy ? 1 : 0;
      } else base = (vx == null ? -Infinity : vx) - (vy == null ? -Infinity : vy);
      return base * state.sortDir;
    });

    const segBtn = (f, lbl, n) => `<button data-f="${f}" class="${state.campFilter === f ? "on" : ""}">${lbl} <span style="opacity:.6">${n}</span></button>`;
    const controls = `<div class="camp-controls">
      <div class="seg">${segBtn("gasto", "Com gasto", nGasto)}${segBtn("ativas", "Ativas", nAtivas)}${segBtn("todas", "Todas", all.length)}</div>
      <input type="search" id="campQuery" placeholder="Filtrar campanha…" value="${esc(state.campQuery)}">
    </div>`;

    const cell = (c, col) => {
      const v = c[col.key];
      switch (col.type) {
        case "status": {
          const on = /ACTIVE/i.test(v || ""), issue = /ISSUE/i.test(v || "");
          const lbl = on ? "Ativa" : /PAUSED/i.test(v || "") ? "Pausada" : /ARCHIV/i.test(v || "") ? "Arquivada" : (v || "—");
          return `<span class="st ${issue ? "issue" : on ? "on" : "off"}">${esc(lbl)}</span>`;
        }
        case "obj": return esc(OBJETIVOS[v] || v || "—");
        case "budget": return v == null ? "—" : fMoney(v, a.currency) + (c.budget_type ? `<span class="pill">${esc(c.budget_type)}</span>` : "");
        case "results": return fInt(v) + (c.result_type && c.result_type !== "—" ? `<span class="pill">${esc(c.result_type)}</span>` : "");
        case "money": return fMoney(v, a.currency);
        case "pct": return fPct(v, 2);
        case "x": return fX(v);
        case "int": return fInt(v);
        case "dec": return fDec(v);
        case "date": return fDate(v);
        default: return v == null || v === "" ? "—" : esc(v);
      }
    };

    const ths = COLS.map(c =>
      `<th data-col="${c.key}">${c.label}${state.sortCol === c.key ? ` <span class="arrow">${state.sortDir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("");
    const rows = list.map(c => "<tr>" + COLS.map(col => `<td>${cell(c, col)}</td>`).join("") + "</tr>").join("");
    const table = list.length
      ? `<div class="table-wrap camp-table"><table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">${state.campQuery ? "Nenhuma campanha bate com o filtro." : state.campFilter === "gasto" ? "Nenhuma campanha com gasto neste período." : "Nada aqui."}</div>`;

    // cards (mobile)
    const cards = list.slice(0, 30).map(c => {
      const on = /ACTIVE/i.test(c.status || "");
      return `<div class="camp-card">
        <div class="cc-head"><span class="cc-name">${esc(c.name)}</span><span class="st ${on ? "on" : "off"}">${on ? "Ativa" : "Pausada"}</span></div>
        <div class="cc-grid">
          <div><b>${fMoney(c.spend, a.currency)}</b><span>Gasto</span></div>
          <div><b>${fInt(c.results)}</b><span>${esc(c.result_type && c.result_type !== "—" ? c.result_type : "Resultados")}</span></div>
          <div><b>${fMoney(c.cpl, a.currency)}</b><span>Custo/resultado</span></div>
          <div><b>${fInt(c.conversas)}</b><span>Conversas</span></div>
          <div><b>${fInt(c.link_clicks)}</b><span>Cliques</span></div>
          <div><b>${fPct(c.ctr, 2)}</b><span>CTR</span></div>
        </div>
      </div>`;
    }).join("");
    const cardsWrap = list.length ? `<div class="camp-cards">${cards}${list.length > 30 ? `<div class="empty">+ ${list.length - 30} campanhas — use a busca pra achar uma específica.</div>` : ""}</div>` : "";

    return `<h2 class="section">Campanhas <span class="cnt">${list.length} de ${all.length}</span></h2>` + controls + table + cardsWrap;
  }

  // re-render só da área de campanhas (busca não pode perder o foco do input)
  function renderCampArea() {
    const a = ACCTS.find(x => x.client === state.tab);
    const area = document.getElementById("campArea");
    if (!a || !area) return;
    const q = document.getElementById("campQuery");
    const pos = q ? q.selectionStart : null;
    area.innerHTML = renderCamps(a);
    wire();
    const q2 = document.getElementById("campQuery");
    if (q2) { q2.focus(); if (pos != null) q2.setSelectionRange(pos, pos); }
  }

  init();
})();
</script>
</body>
